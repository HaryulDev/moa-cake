    <path d="M-16 -60 L-21 -76" stroke="#fff" stroke-width="3.5" opacity=".85" stroke-linecap="round"/>
    <path d="M-11 -40 L-13 -48" stroke="#fff" stroke-width="2.4" opacity=".7" stroke-linecap="round"/>
    <path d="M19 -70 L15 -56" stroke="#fff" stroke-width="1.6" opacity=".5" stroke-linecap="round"/>
    <path d="M-28 -80 Q-16 -96 -3 -90 Q4 -100 12 -92 Q22 -98 28 -80" fill="#f4f7fb" fill-opacity=".85" stroke="#c9d2dc" stroke-width="1.6"/>
    <path d="M-6 -93 Q0 -98 6 -93 L4 -104 Q0 -108 -4 -104Z" fill="#f4f7fb" stroke="#c9d2dc" stroke-width="1.2"/>
    <rect x="-9" y="-99" width="18" height="5" rx="2.5" fill="#ff6f9b"/>
    ${sq?`<path d="M-34 -50 l-8 -2 M34 -50 l8 -2 M-33 -40 l-7 2 M33 -40 l7 2" stroke="#ff8fb1" stroke-width="2" stroke-linecap="round"/>`:''}</g>`;
}
/* 크림을 짤 수 있는 자리: 케이크 윗면 어디든, 또는 각 단 아래 둘레(가까우면 둘레에 딱 붙어요) */
/* 아래 둘레 근처면 둘레에 딱 붙는 '조개 모양' 크림 — 둘레 방향(ang)으로 눕혀서 짜져요 */
function baseHit(c,x,y,maxD){
  let best=null, bd=maxD; const N=90, pts=samplePts(c.shape,N);
  geom(c).forEach(t => pts.forEach(([u,v],j) => {
    if (v < -.05) return;
    const px=t.cx+u*t.R*1.03, py=t.bottom+v*t.R*K*1.03, dd=Math.hypot(px-x,py-y);
    if (dd<bd){ const [u1,v1]=pts[(j+1)%N], [u0,v0]=pts[(j+N-1)%N]; bd=dd;
      best={tier:t.idx, u:u*1.03, v:v*1.03, base:true, shell:true, ang:Math.atan2((v1-v0)*K,(u1-u0))*180/Math.PI}; }
  }));
  return best;
}
function dollopAt(c,x,y){
  const b = baseHit(c,x,y,12); if (b) return b;           // 둘레에 아주 가까우면 무조건 둘레 크림
  const h = hitTier(c,x,y);
  if (h) return {tier:h.tier, u:h.u, v:h.v, base:false};   // 윗면: 별깍지로 뾰족하게
  return baseHit(c,x,y,26);
}
function pipeNew(p,size,prev){
  const c=G.cake, hit=dollopAt(c,p.x,p.y);
  if (!hit) return null;
  if (hit.shell && prev){ const a=hit.ang*Math.PI/180; if (Math.cos(a)*(p.x-prev.x)+Math.sin(a)*(p.y-prev.y) < 0) hit.ang += 180; }
  const d = Object.assign(hit, {col:G.bagCol, s:size, rot:rnd(-10,10)});
  c.dollops.push(d);
  beep(rnd(260,320),.06,'sine',.04);
  return d;
}
function pipeDown(e){
  const p=svgPt(e);
  const d = pipeNew(p,.3);
  if (!d){ if (overCake(G.cake,p.x,p.y)) toast('케이크 윗면이나 아래 테두리에 짜 주세요!'); return; }
  G.squeeze = {d, last:p, t:performance.now(), size:.3};
  $('#view').setPointerCapture(e.pointerId);
  requestAnimationFrame(squeezeFrame);
}
function squeezeFrame(now){
  if (!G || !G.squeeze) return;
  const q=G.squeeze, dt=Math.min(50,now-q.t); q.t=now;
  if (q.d.s < 1.35){ q.d.s = Math.min(1.35, q.d.s + dt/(q.d.base ? 600 : 1400)); q.size = q.d.s; viewFrost(); $('#fx').innerHTML = bagSVG(q.cur||q.last, FROST[G.bagCol].c, true); }
  requestAnimationFrame(squeezeFrame);
}
function frostDown(e){
  if (use3D()) return frostDown3(e);
  const p=svgPt(e), c=G.cake;
  if (G.tool==='bag'){ pipeDown(e); return; }
  if (!c.frost){ if (overCake(c,p.x,p.y)){ toast('크림 색을 먼저 골라주세요!'); sfx.bad(); } return; }
  G.spreading = true; G.last = p; $('#view').setPointerCapture(e.pointerId);
  if (overCake(c,p.x,p.y) && paintAt(p.x,p.y)) viewFrost();
}
function frostMove(e){
  if (use3D()) return frostMove3(e);
  const p=svgPt(e), c=G.cake, over=overCake(c,p.x,p.y);
  if (G.tool==='bag'){
    const q=G.squeeze;
    if (q && Math.hypot(p.x-q.last.x, p.y-q.last.y) >= (q.d.shell?15:20)*Math.max(.75,q.size)){
      const d = pipeNew(p, Math.max(.6,q.size), q.last);
      if (d && d.shell && q.d.shell && !q.turned){ q.d.ang = d.ang; q.turned = true; }  // 첫 조개도 드래그 방향으로
      if (d){ q.d = d; q.last = p; viewFrost(); }
    }
    if (q) q.cur = p;
    $('#fx').innerHTML = (over||q) ? bagSVG(p, FROST[G.bagCol].c, !!q) : '';
    return;
  }
  const col = c.frost ? FROST[c.frost].c : null;
  if (!G.spreading){ $('#fx').innerHTML = over && c.frost ? spatula(p,col) : ''; return; }
  const d = Math.hypot(p.x-G.last.x, p.y-G.last.y), n = Math.max(1, Math.ceil(d/7));
  let changed=false;
  for (let k=1;k<=n;k++){ const x=lerp(G.last.x,p.x,k/n), y=lerp(G.last.y,p.y,k/n); if (overCake(c,x,y) && paintAt(x,y)) changed=true; }
  G.last = p;
  if (changed){ if (Math.random()<.06) beep(rnd(500,700),.04,'sine',.02); viewFrost(); }
  $('#fx').innerHTML = spatula(p,col);
}

/* ---------- 3D: 토핑 놓기 · 옮기기 ---------- */
function decoDown3(e){
  const c=G.cake;
  if (G.stamp){ dropDeco3(G.stamp, e); return; }
  const i = C3D.hitDeco(e);
  if (i==null){ startTurn(e); return; }
  const d = c.decos.splice(i,1)[0];
  startDrag(d.type, e, ev => dropDeco3(d.type, ev));
  C3D.sync(c, ['dollops','decos']); renderCard();
}
function dropDeco3(type, e){
  const c=G.cake, now=performance.now();
  const done = () => { C3D.sync(c, ['dollops','decos','sprinkles']); renderCard(); };
  if (type!=='sprinkle' && type!=='candle'){
    const di = C3D.hitDollop(e), cr = di!=null ? c.dollops[di] : null;
    if (cr && !cr.base){
      if (cr.id==null) cr.id = Math.floor(rnd(1,1e9));
      c.decos.push({type, tier:cr.tier, u:cr.u, v:cr.v+.0005, cream:cr.id, creamCol:cr.col, rot:rnd(-10,10), at:now});
      sfx.pop(); bomiReact('wink',900); done(); return true;
    }
  }
  const h = C3D.hit(e);
  if (!h || h.part!=='top'){
    const r = $('#gl').getBoundingClientRect();
    if (e.clientX>r.left && e.clientX<r.right && e.clientY>r.top && e.clientY<r.bottom) toast('케이크 윗면에 놓아 주세요!');
    done(); return false;
  }
  if (type==='sprinkle'){
    const cols=['#ff6f9b','#ffd36e','#6fd2c0','#8aa2ff','#ffffff','#c48aff','#ff9a5a'], i=h.tier, up=i<c.tiers-1 ? TR[i]/TR[i+1] : 0;
    let n=0, tries=0;
    while (n<45 && tries<2000){ tries++;
      const u=rnd(-1.05,1.05), v=rnd(-1.05,1.05);
      if (!inShape(c.shape,u*1.05,v*1.05) || (up && inShape(c.shape,u*up*1.05,v*up*1.05))) continue;
      c.sprinkles[i].push({u,v,col:pick(cols),a:rnd(0,180)}); n++;
    }
    c.lastSprinkle = i; c.lastSprinkleAt = now;
    [0,1,2].forEach(k=>beep(900+k*250,.05,'sine',.04,k*.04));
  } else {
    c.decos.push({type, tier:h.tier, u:h.u, v:h.v, rot:rnd(-12,12), at:now});
    sfx.pop();
  }
  done(); return true;
}
function decoMove(e){
  if (!G.stamp) return;
  const p=svgPt(e);
  $('#fx').innerHTML = `<g opacity=".55">${iconAt(G.stamp, p.x, p.y-12, 30)}</g><circle cx="${p.x}" cy="${p.y}" r="3" fill="#ff6f9b"/>`;
}
function setStamp(type){
  G.stamp = G.stamp===type ? null : type;

function trayDeco(){

function bindDeco(){
  const c=G.cake;

function decoDown(e){
  if (use3D()) return decoDown3(e);
  if (G.stamp){ dropDeco(G.stamp, e); return; }   // 선택된 토핑을 콕 누른 자리에 계속 놓기
  const el = e.target.closest && e.target.closest('[data-i]'); if (!el) return;
  const d = G.cake.decos.splice(+el.dataset.i,1)[0];

/* 놓은 자리 근처에 윗면 크림(짤주머니 크림)이 있으면 그 크림 꼭대기에 얹어요 */
function creamUnder(c,x,y){
  const g=geom(c); let best=null, bd=1e9;
  (c.dollops||[]).forEach(d => {
    if (d.base) return;
    const t=g.find(q=>q.idx===d.tier); if (!t) return;
    const isPressed = d.id!=null && c.decos.some(o=>o.cream===d.id);
    const h=(isPressed?14:37)*d.s, cx=t.cx+d.u*t.R, cy=t.ty+d.v*t.R*K - h*.5;  // 크림 덩이 가운데
    const dd=Math.hypot((x-cx)/(20*d.s+6), (y-cy)/(h*.6+6));
    if (dd<1 && dd<bd){ bd=dd; best=d; }
  });
  return best;
}
function dropDeco(type, e){
  if (use3D()) return dropDeco3(type, e);
  const c=G.cake, p=svgPt(e);
  const cream = type!=='sprinkle' && type!=='candle' ? creamUnder(c,p.x,p.y) : null;
  if (cream){
    if (cream.id==null) cream.id = Math.floor(rnd(1,1e9));
    // 눌린 크림 높이만큼 위에 얹어요
    c.decos.push({type, tier:cream.tier, u:cream.u, v:cream.v+.0005, lift:13*cream.s, cream:cream.id, creamCol:cream.col, rot:rnd(-10,10), at:performance.now()});
    sfx.pop(); bomiReact('wink',900); renderView(); renderCard(); return true;
  }
  const hit = hitTier(c,p.x,p.y);
  if (!hit){ if (p.x>0&&p.x<600&&p.y>0&&p.y<400) toast('케이크 윗면에 놓아 주세요!'); renderView(); renderCard(); return false; }
  if (type==='sprinkle'){
    const g=geom(c), t=g[hit.tier], cols=['#ff6f9b','#ffd36e','#6fd2c0','#8aa2ff','#ffffff','#c48aff','#ff9a5a'];
    let n=0, tries=0;
    while (n<45 && tries<2000){ tries++;
      const u=rnd(-1.05,1.05), v=rnd(-1.05,1.05), x=t.cx+u*t.R, y=t.ty+v*t.R*K;
      const h=hitTier(c,x,y); if (!h || h.tier!==hit.tier) continue;
      c.sprinkles[hit.tier].push({u,v,col:pick(cols),a:rnd(0,180)}); n++;
    }
    c.lastSprinkle = hit.tier; c.lastSprinkleAt = performance.now();
    [0,1,2].forEach(i=>beep(900+i*250,.05,'sine',.04,i*.04));
  } else {
    c.decos.push({type, tier:hit.tier, u:hit.u, v:hit.v, rot:rnd(-12,12), at:performance.now()});
    sfx.pop();
  }
  renderView(); renderCard();
  return true;
}

/* ---------- 포인터 연결 ---------- */
const view = $('#view');
view.addEventListener('pointerdown', e => {

  if (use3D() && C3D.host()===$('#gl') && !C3D.overCake(e) && !(G.step===4 && G.stamp)){ startTurn(e); return; }
  if (STEPS[G.step].down){ STEPS[G.step].down(e); if (G.mixing||G.spreading||G.squeeze||G.pouring||G.unm) setBomi('focus'); }
});
view.addEventListener('pointermove', e => {
  if (G && G.turning){ turnMove(e); return; }
  if (G && !G.drag && STEPS[G.step] && STEPS[G.step].move) STEPS[G.step].move(e);
});
view.addEventListener('pointerleave', () => { if (G && !G.mixing && !G.spreading && !G.unm) $('#fx').innerHTML=''; });
window.addEventListener('pointermove', e => { if (G && G.drag) moveGhost(e); });
window.addEventListener('pointerup', e => {
  if (!G) return;
  if (G.drag){ const d=G.drag; d.el.remove(); G.drag=null; d.onDrop(e, Math.hypot(e.clientX-d.sx, e.clientY-d.sy) < 6); }
  if (G.pouring) stopPour();
  if (G.unm) unmoldUp();
  if (G.squeeze){ G.squeeze = null; if (G.step===3){ sfx.pop(); renderTray(); viewFrost(); } }
  if (G.spreading && use3D() && G.step===3){ C3D.measure(G.cake); frostHUD(); }
  if (G.mixing && Math.abs(G.swirlVel||0) > .3){ const spin = () => { if (!G || G.mixing || G.step!==0) return; G.swirlVel *= .9; G.swirl += G.swirlVel;
      drawMixFrame('', true); if (Math.abs(G.swirlVel) > .2) requestAnimationFrame(spin); else G.swirlVel = 0; }; requestAnimationFrame(spin); }
  G.turning = null;
  G.mixing = false; G.spreading = false;
  setBomi('happy');
});

const STEPS = [
  {view:viewMix, tray:trayMix, bind:bindMix, down:mixDown, move:mixMove},

/* ================= 6. 완성 & 채점 ================= */
function scoreCake(c,o){
  const rows=[];
  const miss = BASE_ING.filter(x=>!c.ing[x.id]).length;
  const extra = BASE_ING.reduce((s,x)=>s+Math.max(0,(c.ing[x.id]||0)-1),0);
  const exMiss = o.extra && !c.ing[o.extra];
  const exName = o.extra ? EXTRAS.find(x=>x.id===o.extra).n : '';
  rows.push(['반죽 재료', miss?`${miss}가지 빠짐`:extra?'너무 많이 넣음':exMiss?`${exName}을(를) 안 넣었어요`:'정확해요', Math.max(0,10-miss*4-extra*2-(exMiss?4:0)), 10]);
  { const fl = flavList(c); rows.push(['맛', fl.map(k=>FLAVORS[k].n).join('+'), fl.includes(o.flavor) ? (fl.length===1 ? 10 : 7) : 0, 10]); }
  rows.push(['모양', SHAPE_N[c.shape], c.shape===o.shape?10:0, 10]);
  rows.push(['단수', c.tiers+'단', c.tiers===o.tiers?10:Math.abs(c.tiers-o.tiers)===1?4:0, 10]);
  const pq = G.pans.reduce((a,p)=>a+pourQuality(p.fill),0)/G.pans.length;
  rows.push(['붓기', G.pans.map(p=>pourLabel(p.fill)).join(', '), Math.round(10*pq), 10]);
  rows.push(['굽기', bakeLabel(c.bake), Math.round(15*bakeQuality(c.bake)), 15]);
  rows.push(['크림', c.frost?`${FROST[c.frost].n} ${Math.round(c.cover*100)}%`:'안 발랐어요', (c.frost===o.frost?7:0)+Math.round(8*Math.min(1,c.cover)), 15]);
  let ts=0; const desc=[];
  o.tops.forEach(t => { const n=c.decos.filter(d=>d.type===t.id).length; ts+=Math.max(0,1-Math.abs(n-t.n)/t.n); desc.push(`${TOP[t.id].n} ${n}/${t.n}`); });
  rows.push(['토핑', desc.join(', '), Math.round(20*ts/o.tops.length), 20]);
  return {rows, total: rows.reduce((s,r)=>s+r[2],0)};
}
function finish(){
  const c=G.cake; G.step=5; renderHeader(); $('#fx').innerHTML='';
  G.drag = null; document.querySelectorAll('.ghost').forEach(g=>g.remove());
  // 완성된 케이크를 내미는 모아 (오른쪽 아래) + 말풍선
  const cakeSvg = (mood, pose, line) => use3D() ? `<div class="r3d"><div id="resGL"></div>${bomiSVG(mood,'full',pose,'class="rBomi"')}<div class="rSay">${line}</div><div class="rSpin">케이크가 빙글빙글 돌아가요</div></div>` : `<svg viewBox="40 150 520 450">
      ${iconAt('sparkle',220,190,34)}${iconAt('sparkle',380,186,26)}${iconAt('sparkle',300,176,20)}
      <g transform="translate(0 40)">${renderCake(c,{cx:300,baseY:430,sc:1.15})}</g>
      ${bomiSVG(mood,'full',pose,'x="440" y="430" width="128" height="176"')}
      <g transform="translate(432 424)"><rect x="-96" y="-22" width="122" height="34" rx="14" fill="#fff" stroke="#ffd3e0" stroke-width="2"/>
        <path d="M14 11 L26 24 L4 12Z" fill="#fff"/><text x="-35" y="0" text-anchor="middle" font-size="14" fill="#d24d7a" font-family="Jua,sans-serif">${line}</text></g></svg>`;
  if (G.mode==='free'){
    $('#modal').innerHTML = `<div class="panel result">${cakeSvg('love','present','짜잔! 완성!')}<div class="rinfo">
      <div class="cust"><div class="face">${bomiSVG('love')}</div><div class="cname" style="font-size:24px">모아의 케이크 완성!</div></div>
      <div class="bubble" style="font-size:20px">세상에 하나뿐인 내 케이크가 완성됐어! 할머니께도 보여 드리고 싶다!</div>
      <ul class="ord"><li><b>맛</b>${flavorLabel(c)}</li><li><b>모양</b>${SHAPE_N[c.shape]} · ${c.tiers}단</li>
        <li><b>굽기</b>${bakeLabel(c.bake)}</li><li><b>크림</b>${c.frost?FROST[c.frost].n+' '+Math.round(c.cover*100)+'%':'없음'}</li><li><b>토핑</b>${c.decos.length}개${c.text?` · "${esc(c.text)}"`:''}</li></ul>
      <div class="rbtns"><button class="next" id="again">${icon('palette')} 새로 만들기</button><button class="next small" id="toHome">${icon('home')} 처음으로</button></div></div></div>`;
    $('#modal').classList.add('on'); sfx.fanfare(); confetti(30);
    if (use3D()) C3D.mount($('#resGL'), c, 'result');
    $('#again').onclick = () => { closeModal(); startGame('free'); };
    $('#toHome').onclick = () => { closeModal(); goHome(); };
    return;
  }
  const o=G.order, {rows,total} = scoreCake(c,o);
  const stars = total>=90?3:total>=70?2:total>=40?1:0;
  const tip = total>=60 ? Math.round(G.patience*30) : 0;
  const earned = Math.round((40+o.tiers*20)*total/100) + tip;
  const oldRank = rankOf(save.served);

/* 휴대폰 탭 보강: 일부 휴대폰·앱 화면에서는 손가락 탭이 click으로 바뀌지 않아요.
   그래서 버튼 위에서 눌렀다 뗀 터치(거의 안 움직였을 때)를 직접 click으로 실행하고,
   뒤따라오는 진짜 click은 한 번만 실행되도록 무시해요. */
(() => {
  let tap = null;
  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') { tap = null; return; }
    const b = e.target.closest && e.target.closest('button');
    tap = b ? {b, x:e.clientX, y:e.clientY} : null;
  }, true);
  document.addEventListener('pointerup', e => {
    if (!tap || e.pointerType === 'mouse') return;
    const {b, x, y} = tap; tap = null;
    if (Math.hypot(e.clientX-x, e.clientY-y) > 14 || b.disabled || !b.isConnected) return;
    b._tapAt = Date.now(); b.click();
  }, true);
  document.addEventListener('pointercancel', () => { tap = null; }, true);
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('button');
    if (b && e.isTrusted && b._tapAt && Date.now() - b._tapAt < 800){ b._tapAt = 0; e.preventDefault(); e.stopImmediatePropagation(); }
  }, true);
})();

/* 화면 맞춤: 세로가 긴 화면(휴대폰 세로)이면 세로 배치로 바꾸고, 어떤 화면이든 꽉 차게 확대·축소 */
function fit(){
  // 실제로 보이는 영역 크기: 무대(#stage)의 크기. 휴대폰(터치)에서는 기기 화면 크기를 넘지 않게 한 번 더 제한해요.
  const st = $('#stage');
  let w = st.clientWidth || innerWidth, h = st.clientHeight || innerHeight;
  if (window.visualViewport){ w = Math.min(w, visualViewport.width); h = Math.min(h, visualViewport.height); }
  if (matchMedia('(pointer:coarse)').matches && screen.width){
    const sw = Math.min(screen.width, screen.height), sh = Math.max(screen.width, screen.height);
    const land = w > h;
    w = Math.min(w, land ? sh : sw); h = Math.min(h, land ? sw : sh);
  }
  // 기기 종류 읽기: 손가락 터치 + 짧은 쪽 화면 크기로 휴대폰 · 태블릿 · PC를 나눠요
  const coarse = matchMedia('(pointer:coarse)').matches, sMin = Math.min(screen.width||w, screen.height||h);
  const device = coarse && sMin < 600 ? 'phone' : coarse && sMin < 1000 ? 'tablet' : 'pc';
  document.documentElement.dataset.device = device;
  // 휴대폰 세로·좁은 창은 '흐르는 배치'(실제 크기, 위→아래), 그 밖에는 960×600 화면을 비율 그대로 꽉 차게
  const fluid = device==='phone' ? (h > w*1.05 || w < 700) : (w < 760 || h > w*1.15);
  const g = $('#game'), was = g.classList.contains('fluid');
  g.classList.toggle('fluid', fluid);
  if (fluid){
    SCALE = 1; g.style.transform = '';
  } else {
    // PC·가로 화면: 960×600 화면을 통째로 맞춰서 가운데에
    const W = 960, H = 600, pad = Math.min(w,h) < 500 ? 4 : 30;
    SCALE = Math.max(.1, Math.min((w-pad)/W, (h-pad)/H, 1.6));
    g.style.transform = `translate(${((w-W*SCALE)/2).toFixed(1)}px, ${((h-H*SCALE)/2).toFixed(1)}px) scale(${SCALE})`;
  }
  if (was!==fluid && G && $('#play').classList.contains('on')) renderAll();
}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
/* =====================================================================
   3D 케이크 (Three.js) — 크림·장식·완성·타이틀 화면의 케이크를 진짜 3D로 그려요.

import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const C3D = window.C3D = { ok:false };
const LITE = matchMedia('(pointer:coarse)').matches && Math.min(screen.width, screen.height) < 600;
let dirty = true;   // 다시 그릴 일이 있으면 true

const R3 = TR.map(r => r/100), H3 = [.8, .68, .58];
const Y0 = .71, CREAM = .035, BRUSH3 = .27;

let renderer;

function init(){

const canvas = renderer.domElement; canvas.className = 'gl3d';

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);

const camera = new THREE.PerspectiveCamera(30, 1.5, .1, 100);

scene.add(new THREE.HemisphereLight(0xfff2f6, 0xd9b6c2, .75));
const sun = new THREE.DirectionalLight(0xfff0e4, 2.3);
sun.position.set(-4, 8, 5); sun.castShadow = true; sun.shadow.mapSize.set(LITE ? 768 : 1536, LITE ? 768 : 1536); sun.shadow.radius = 5; sun.shadow.bias = -.0005; sun.shadow.normalBias = .02;
Object.assign(sun.shadow.camera, {left:-3.5, right:3.5, top:4, bottom:-3.5, near:1, far:20});

const rim = new THREE.DirectionalLight(0xffd3e4, 1.1); rim.position.set(5, 3, -6); scene.add(rim);
const fill = new THREE.DirectionalLight(0xfff3ec, .85); fill.position.set(3, 2.5, 8); scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({opacity:.2}));

const root = new THREE.Group(); scene.add(root);          // 돌림판 (케이크 + 받침이 같이 돌아요)
const parts = {stand:new THREE.Group(), tiers:new THREE.Group(), dollops:new THREE.Group(), decos:new THREE.Group(), sprinkles:new THREE.Group(), text:new THREE.Group()};
Object.values(parts).forEach(g => root.add(g));

/* ---------- 공용 도구 ---------- */
const col = h => new THREE.Color(h);
const MC = {};
const phys = (key, o) => MC[key] || (MC[key] = new THREE.MeshPhysicalMaterial(o));

function mkCanvas(w, h, draw){ const c = document.createElement('canvas'); c.width = w; c.height = h; draw && draw(c.getContext('2d'), w, h); return c; }

// 크림 결(스패출러 자국) 범프
const creamBump = (() => { const t = new THREE.CanvasTexture(mkCanvas(512, 256, (g, w, h) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  for (let i=0;i<1100;i++){ g.fillStyle = Math.random()<.5 ? 'rgba(255,255,255,.07)' : 'rgba(0,0,0,.07)'; g.fillRect(Math.random()*w, Math.random()*h, 30+Math.random()*150, 1+Math.random()*3); }

/* ---------- 모양 데이터 (윤곽 점 · 바깥 법선 · 둘레 비율) ---------- */
const SHP = {};
function shapeData(shape){

  const N = 160; let pts = samplePts(shape, N).map(p => [p[0], p[1]]);
  let A = 0; for (let i=0;i<N;i++){ const [x0,y0]=pts[i], [x1,y1]=pts[(i+1)%N]; A += x0*y1 - x1*y0; }

function nearestIdx(sd, u, v){ let b = 0, bd = 1e9; sd.pts.forEach(([x,y],i) => { const d = (x-u)**2 + (y-v)**2; if (d < bd){ bd = d; b = i; } }); return b; }

const GC = {};
function sideGeo(shape, R, h0, h1){

    pos.push(u*R, h0, v*R, u*R, h1, v*R); nor.push(n[0],0,n[1], n[0],0,n[1]); uv.push(sd.cum[i], 0, sd.cum[i], 1); }
  for (let i=0;i<N;i++){ const a = i*2; idx.push(a, a+1, a+2, a+1, a+3, a+2); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));

}
function topGeo(shape, R){

  for (let i=0;i<p.count;i++) uv.setXY(i, p.getX(i)/R/2.3 + .5, p.getZ(i)/R/2.3 + .5);
  return GC[k] = g;
}
function rimGeo(shape, R, y, r){

  const sd = shapeData(shape);
  const curve = new THREE.CatmullRomCurve3(sd.pts.map(([u,v],i) => new THREE.Vector3(u*R - sd.nrm[i][0]*r*.55, y, v*R - sd.nrm[i][1]*r*.55)), true);

}

/* ---------- 케이크 받침 (금테 도자기 스탠드) ---------- */
(() => {
  const porcelain = phys('porc', {color:0xfdf6fa, roughness:.22, clearcoat:1, clearcoatRoughness:.08});
  const gold = std('gold', {color:0xe2b45e, metalness:1, roughness:.28});
  parts.stand.add(mesh(lathe([[0,0],[.8,0],[.84,.04],[.78,.08],[.38,.13],[.17,.24],[.12,.44],[.17,.5],[.12,.56],[.24,.61],[1.92,.64],[2.02,.68],[2.0,.72],[1.84,.72],[0,.71]], 96), porcelain));
  parts.stand.add(mesh(new THREE.TorusGeometry(2.0, .025, 12, 128), gold, m => { m.rotation.x = Math.PI/2; m.position.y = .705; }));
  parts.stand.add(mesh(new THREE.TorusGeometry(.82, .022, 12, 96), gold, m => { m.rotation.x = Math.PI/2; m.position.y = .045; }));
  // 레이스 받침지
  const doily = mkCanvas(512, 512, (g, w) => {
    g.translate(w/2, w/2); g.fillStyle = '#fff';
    for (let k=0;k<48;k++){ const a = k/48*Math.PI*2; g.beginPath(); g.arc(Math.cos(a)*226, Math.sin(a)*226, 22, 0, 7); g.fill(); }
    g.beginPath(); g.arc(0, 0, 228, 0, 7); g.fill();
    g.globalCompositeOperation = 'destination-out';
    for (let ring=0; ring<3; ring++){ const rr = 236 - ring*26, n = 48 - ring*8;
      for (let k=0;k<n;k++){ const a = (k+ring*.5)/n*Math.PI*2; g.beginPath(); g.ellipse(Math.cos(a)*rr, Math.sin(a)*rr, 5-ring, 3.4-ring*.6, a, 0, 7); g.fill(); } }
  });
  const dm = std('doily', {map:texOf(doily), alphaTest:.5, roughness:.9, side:THREE.DoubleSide});
  parts.stand.add(mesh(new THREE.PlaneGeometry(3.6, 3.6), dm, m => { m.rotation.x = -Math.PI/2; m.position.y = Y0 + .004; m.castShadow = false; }));
})();

/* ---------- 스펀지 질감 (작은 기공 + 가운데 크림 층) ---------- */
const spongeMaps = {};
function spongeMat(hex){
  if (spongeMaps[hex]) return spongeMaps[hex];
  const cv = mkCanvas(512, 128, (g, w, h) => {
    g.fillStyle = hex; g.fillRect(0, 0, w, h);
    for (let i=0;i<1600;i++){ g.fillStyle = Math.random()<.5 ? shade(hex,-.18) : shade(hex,.14); g.globalAlpha = .45; g.beginPath(); g.ellipse(Math.random()*w, Math.random()*h, 1+Math.random()*2.2, .8+Math.random()*1.4, 0, 0, 7); g.fill(); }
    g.globalAlpha = 1; g.fillStyle = '#fff3e2'; g.fillRect(0, h*.45, w, h*.1);
    g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(0, h*.46, w, h*.025);
    const grd = g.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, 'rgba(90,40,10,.25)'); grd.addColorStop(.12, 'rgba(0,0,0,0)'); grd.addColorStop(.85, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(90,40,10,.3)');
    g.fillStyle = grd; g.fillRect(0, 0, w, h);

  return spongeMaps[hex] = {side:new THREE.MeshStandardMaterial({map:t, roughness:.85, side:THREE.DoubleSide}),
    top:new THREE.MeshStandardMaterial({color:shade(hex,-.1), roughness:.8, bumpMap:creamBump, bumpScale:2})};
}

/* ---------- 크림 바르기: 단마다 윗면·옆면 '바른 자리' 그림 ---------- */
const blackCv = (w, h) => mkCanvas(w, h, (g) => { g.fillStyle = "#000"; g.fillRect(0, 0, w, h); });
function newPaint(){ return {top:blackCv(256, 256), side:blackCv(512, 128)}; }
C3D.resetPaint = c => { c.paint = [0,1,2].map(newPaint); c.paintN = 0; };
function paintTex(cv){ if (!cv._tex){ cv._tex = texOf(cv, false); } return cv._tex; }
function dab(cv, x, y, rx, ry, wrap){
  const g = cv.getContext('2d');
  const draw = xx => { const grd = g.createRadialGradient(0, 0, 0, 0, 0, 1); grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(.65, 'rgba(255,255,255,.9)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.save(); g.translate(xx, y); g.scale(rx, ry); g.fillStyle = grd; g.beginPath(); g.arc(0, 0, 1, 0, 7); g.fill(); g.restore(); };
  draw(x); if (wrap){ if (x - rx < 0) draw(x + cv.width); if (x + rx > cv.width) draw(x - cv.width); }
  cv._tex && (cv._tex.needsUpdate = true); dirty = true;
}
function tierBase(i){ let y = Y0; for (let k=0;k<i;k++) y += H3[k]; return y; }
function topY(c, i){ return tierBase(i) + H3[i] + (hasFrost(c) ? CREAM : 0); }
/* 맞은 자리에 크림을 발라요 (part: top/side/rim, uv: 0~1) */
C3D.paintHit = (c, hit) => {
  if (!c.paint) C3D.resetPaint(c);
  const i = hit.tier, R = R3[i]*1.03, sd = shapeData(c.shape), P = c.paint[i], H = H3[i] + CREAM;
  const sideDab = (U, V) => dab(P.side, U*512, V*128, BRUSH3/(sd.L*R)*512, BRUSH3/H*128, true);
  const topDab = (U, V) => dab(P.top, U*256, V*256, BRUSH3/(2.3*R3[i])*256, BRUSH3/(2.3*R3[i])*256);
  if (hit.part === 'top'){
    topDab(hit.uv.x, hit.uv.y);
    const u = (hit.uv.x-.5)*2.3, v = (hit.uv.y-.5)*2.3, j = nearestIdx(sd, u, v), [pu,pv] = sd.pts[j];
    if (Math.hypot(pu-u, pv-v)*R3[i] < BRUSH3) sideDab(sd.cum[j], 1);
  } else {
    sideDab(hit.uv.x, hit.part==='rim' ? 1 : hit.uv.y);
    if (hit.part==='rim' || hit.uv.y > .8){ const j = Math.round(hit.uv.x*sd.N)%sd.N, [pu,pv] = sd.pts[j]; topDab(pu/2.3+.5, pv/2.3+.5); }
  }

};
// 바른 넓이 비율 (위층에 가려진 윗면은 빼고 계산)
const maskCache = {}, probe = mkCanvas(64, 64);
function topMask(c, i){
  const k = `${c.shape}${c.tiers}${i}`; if (maskCache[k]) return maskCache[k];
  const m = [];
  for (let y=0;y<64;y++) for (let x=0;x<64;x++){ const u = ((x+.5)/64-.5)*2.3, v = ((y+.5)/64-.5)*2.3;
    if (!inShape(c.shape, u, v)) continue;
    if (i < c.tiers-1){ const s = R3[i]/R3[i+1]; if (inShape(c.shape, u*s*1.05, v*s*1.05)) continue; }
    m.push(y*64+x); }

C3D.measure = c => {

    const d = g.getImageData(0, 0, 64, 64).data, m = topMask(c, i);
    let n = 0; m.forEach(k => { if (d[k*4+1] > 110) n++; });

    g.clearRect(0, 0, 64, 16); g.drawImage(P.side, 0, 0, 64, 16);

  }
  const was = c.cover;
  c.cover = all ? got/all : 0;
  if (was < .93 && c.cover >= .93){ c.frostFull = true; c.cover = 1; sfx.ok(); toast('크림을 매끈하게 발랐어요!'); C3D.sync(c, ['tiers']); }
  return c.cover;
};

/* ---------- 단 (스펀지 + 크림) ---------- */
const pickables = [];      // 클릭으로 맞힐 수 있는 것들
function buildTiers(c){
  const sp = spongeColor(c), sm = spongeMat(sp), fr = c.frost ? FROST[c.frost].c : null;
  for (let i=0;i<c.tiers;i++){
    const R = R3[i], H = H3[i], b = tierBase(i);
    const side = mesh(sideGeo(c.shape, R, 0, H), sm.side, m => m.position.y = b); side.userData = {tier:i, part:'side', sponge:true};
    const top = mesh(topGeo(c.shape, R), sm.top, m => m.position.y = b + H); top.userData = {tier:i, part:'top', sponge:true};
    parts.tiers.add(side, top); pickables.push(side, top);
    if (!c.frost) continue;
    if (!c.paint) C3D.resetPaint(c);
    const full = c.frostFull, P = c.paint[i];
    const base = {color:col(fr), roughness:.5, sheen:.25, sheenColor:col(shade(fr,.35)), bumpMap:creamBump, bumpScale:.8, side:THREE.DoubleSide};
    const mTop = new THREE.MeshPhysicalMaterial(Object.assign({}, base, full ? {} : {alphaMap:paintTex(P.top), alphaTest:.38}));
    const mSide = new THREE.MeshPhysicalMaterial(Object.assign({}, base, full ? {} : {alphaMap:paintTex(P.side), alphaTest:.38}));
    const R2 = R*1.03;
    const cs = mesh(sideGeo(c.shape, R2, 0, H + CREAM*.4), mSide, m => m.position.y = b); cs.userData = {tier:i, part:'side'};
    const ct = mesh(topGeo(c.shape, R2), mTop, m => m.position.y = b + H + CREAM); ct.userData = {tier:i, part:'top'};
    const cr = mesh(rimGeo(c.shape, R2, H + CREAM*.45, CREAM*.75), mSide, m => m.position.y = b); cr.userData = {tier:i, part:'rim'};
    parts.tiers.add(cs, ct, cr); pickables.push(cs, ct, cr);
  }
}

/* ---------- 짤주머니 크림: 별깍지 로제트 · 조개 모양 ---------- */
const rosGeo = (() => { const pts = []; for (let i=0;i<=28;i++){ const t = i/28; pts.push([.24*Math.pow(1-t,.55)*(1+.25*Math.sin(Math.PI*t)), .4*t]); }
  const g = lathe(pts, 72), p = g.attributes.position;
  for (let i=0;i<p.count;i++){ const x = p.getX(i), y = p.getY(i), z = p.getZ(i), a = Math.atan2(z,x), k = 1 + .17*Math.cos(8*a + y*16); p.setX(i, x*k); p.setZ(i, z*k); }
  g.computeVertexNormals(); return g; })();
const shellGeo = (() => { const g = rosGeo.clone(), p = g.attributes.position;
  for (let i=0;i<p.count;i++){ const x = p.getX(i), y = p.getY(i); p.setX(i, x*1.25 + (x>0 ? x*.55*(1-y/.4) : 0)); p.setY(i, y*.62); }
  g.computeVertexNormals(); return g; })();
const creamMat = k => phys('cream'+k, {color:col(FROST[k].c), roughness:.45, sheen:.25, sheenColor:col(shade(FROST[k].c,.35))});

    s.add(mesh(cylG, phys('pocky', {color:0x4a2412, roughness:.35, clearcoat:.4}), m => { m.scale.set(.02, .36, .02); m.position.y = .18; }), mesh(cylG, std('biscuit', {color:0xe6b877, roughness:.8}), m => { m.scale.set(.018, .1, .018); m.position.y = .41; }));
    s.rotation.z = .45; g.add(s); return g; },
  candy: () => { const g = new THREE.Group(), m = phys('candy', {color:0xff6f9b, roughness:.1, clearcoat:1, transparent:true, opacity:.95});
    g.add(mesh(sphG, m, s => { s.scale.set(.07, .065, .065); s.position.y = .065; }));
    [-1, 1].forEach(sg => g.add(mesh(new THREE.ConeGeometry(.055, .08, 12), phys('wrap', {color:0xffe3ec, roughness:.2, clearcoat:1}), c => { c.rotation.z = sg*Math.PI/2; c.position.set(sg*.1, .065, 0); })));
    return g; },
  lolli: () => { const g = new THREE.Group(), t = TEX.lolli || (TEX.lolli = sliceTex.lolli()), face = phys('lolf', {map:t, roughness:.1, clearcoat:1});
    g.add(mesh(cylG, std('lstick', {color:0xffffff, roughness:.5}), m => { m.scale.set(.012, .3, .012); m.position.y = .15; }));
    g.add(mesh(cylG, [phys('lols', {color:0xff9ab8, roughness:.2, clearcoat:1}), face, face], m => { m.scale.set(.13, .035, .13); m.rotation.x = Math.PI/2; m.position.y = .4; })); return g; },
  pearl: () => { const g = new THREE.Group(), m = phys('pearl', {color:0xffffff, roughness:.12, clearcoat:1, iridescence:.7, iridescenceIOR:1.5});
    [[0,0],[.07,.02],[.02,.07],[-.05,.04]].forEach(([x,z]) => g.add(mesh(sphG, m, s => { s.scale.setScalar(.035); s.position.set(x, .035, z); }))); return g; },
  candle: (d, idx) => { const g = new THREE.Group(), cols = ['#8fd3ff','#ffb3c8','#b8f0a8','#ffe28a','#d8b7ff'], cc = cols[idx % cols.length];
    const tex = TEX['c'+cc] || (TEX['c'+cc] = (() => { const t = texOf(mkCanvas(64, 256, (g, w, h) => { g.fillStyle = cc; g.fillRect(0,0,w,h); g.strokeStyle = '#fff'; g.lineWidth = 9;
      for (let y=-80;y<h+80;y+=36){ g.beginPath(); g.moveTo(0, y); g.lineTo(w, y+40); g.stroke(); } })); return t; })());
    g.add(mesh(cylG, phys('cdl'+cc, {map:tex, roughness:.4, clearcoat:.5}), m => { m.scale.set(.03, .34, .03); m.position.y = .17; }));
    g.add(mesh(cylG, std('wick', {color:0x333333}), m => { m.scale.set(.004, .04, .004); m.position.y = .36; }));
    const fl = new THREE.Mesh(lathe([[0,0],[.022,.02],[.024,.05],[.012,.085],[0,.11]], 16), new THREE.MeshBasicMaterial({color:0xffc24a}));
    fl.position.y = .365; fl.userData.flame = true; g.add(fl);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(), color:0xffd27a, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, opacity:.85}));
    glow.scale.setScalar(.22); glow.position.y = .41; g.add(glow); return g; },
  star: () => { const s = new THREE.Shape(); for (let i=0;i<10;i++){ const a = Math.PI/2 + i*Math.PI/5, r = i%2 ? .055 : .13; i ? s.lineTo(Math.cos(a)*r, Math.sin(a)*r) : s.moveTo(Math.cos(a)*r, Math.sin(a)*r); }
    const g = new THREE.Group(), gold = std('goldS', {color:0xffcf4d, metalness:1, roughness:.22});
    g.add(mesh(new THREE.ExtrudeGeometry(s, {depth:.03, bevelEnabled:true, bevelSize:.012, bevelThickness:.012, bevelSegments:2}), gold, m => m.position.set(0, .28, -.015)));
    g.add(mesh(cylG, gold, m => { m.scale.set(.008, .18, .008); m.position.y = .09; })); return g; },
  flower: () => { const g = new THREE.Group(), pm = phys('petal', {color:0xffc2d6, roughness:.5, sheen:.8, sheenColor:col(0xffffff), side:THREE.DoubleSide});
    for (let k=0;k<5;k++){ const a = k/5*Math.PI*2; g.add(mesh(sphG, pm, m => { m.scale.set(.075, .018, .05); m.position.set(Math.cos(a)*.065, .04, Math.sin(a)*.065); m.rotation.set(0, -a, .35); })); }
    g.add(mesh(sphG, phys('pcen', {color:0xffd84d, roughness:.6}), m => { m.scale.set(.035, .025, .035); m.position.y = .055; })); return g; },
  heart: () => { const s = new THREE.Shape(); s.moveTo(0, -.12); s.bezierCurveTo(-.17, .0, -.12, .14, 0, .07); s.bezierCurveTo(.12, .14, .17, 0, 0, -.12);
    const g = new THREE.Group(), m = phys('heartM', {color:0xff3d6e, roughness:.15, clearcoat:1});
    g.add(mesh(new THREE.ExtrudeGeometry(s, {depth:.04, bevelEnabled:true, bevelSize:.015, bevelThickness:.015, bevelSegments:3}), m, h => h.position.set(0, .26, -.02)));
    g.add(mesh(cylG, std('hstick', {color:0xffffff}), c => { c.scale.set(.008, .16, .008); c.position.y = .08; })); return g; },
  ribbon: () => { const g = new THREE.Group(), m = phys('satin', {color:0xff6f9b, roughness:.35, sheen:1, sheenColor:col(0xffd0e0), side:THREE.DoubleSide});
    [-1, 1].forEach(sg => { g.add(mesh(new THREE.TorusGeometry(.06, .018, 10, 24), m, t => { t.scale.set(1.2, .8, .6); t.position.set(sg*.07, .1, 0); t.rotation.z = sg*.3; }));
      g.add(mesh(new THREE.BoxGeometry(.035, .12, .01), m, b => { b.position.set(sg*.04, .04, .01); b.rotation.z = sg*.5; })); });
    g.add(mesh(sphG, m, k => { k.scale.set(.03, .028, .025); k.position.y = .1; })); return g; },
  crown: () => { const g = new THREE.Group(), gold = std('goldC', {color:0xffcf4d, metalness:1, roughness:.22, side:THREE.DoubleSide});
    g.add(mesh(new THREE.CylinderGeometry(.11, .1, .07, 32, 1, true), gold, m => m.position.y = .035));
    for (let k=0;k<6;k++){ const a = k/6*Math.PI*2; g.add(mesh(new THREE.ConeGeometry(.03, .08, 8), gold, c => c.position.set(Math.cos(a)*.105, .11, Math.sin(a)*.105)));
      g.add(mesh(sphG, phys('jewel'+k%3, {color:[0xff3d6e,0x4fb3ff,0x5fd35f][k%3], roughness:.05, clearcoat:1}), j => { j.scale.setScalar(.014); j.position.set(Math.cos(a)*.108, .035, Math.sin(a)*.108); })); }
    return g; },
  butterfly: () => { const g = new THREE.Group(), wm = phys('wing', {color:0x8fc8ff, roughness:.3, transparent:true, opacity:.85, side:THREE.DoubleSide, iridescence:.6});
    [-1, 1].forEach(sg => { const s = new THREE.Shape(); s.moveTo(0, 0); s.bezierCurveTo(.05, .14, .18, .14, .15, .02); s.bezierCurveTo(.16, -.08, .05, -.1, 0, 0);
      const w = mesh(new THREE.ShapeGeometry(s), wm, m => { m.rotation.set(-Math.PI/2 + .2, sg>0 ? .55 : Math.PI - .55, 0); m.position.y = .1; }); w.scale.x = 1; g.add(w); });
    g.add(mesh(capG, std('bbody', {color:0x3a2a4a}), b => { b.scale.set(.02, .1, .02); b.rotation.x = Math.PI/2; b.position.y = .1; })); return g; },
};
let glowT; function glowTex(){ return glowT || (glowT = texOf(mkCanvas(64, 64, (g, w) => { const grd = g.createRadialGradient(32,32,0,32,32,32); grd.addColorStop(0,'rgba(255,240,180,1)'); grd.addColorStop(.4,'rgba(255,200,90,.5)'); grd.addColorStop(1,'rgba(255,180,60,0)'); g.fillStyle = grd; g.fillRect(0,0,w,w); }))); }

function buildDecos(c){
  c.decos.forEach((d, idx) => {
    const make = MODELS[d.type]; if (!make) return;
    const R = R3[d.tier], m = make(d, idx);
    let y = topY(c, d.tier) - .005;
    if (d.cream){ const cr = c.dollops.find(o => o.id === d.cream); if (cr) y = C3D.dollopTop(c, cr); }
    m.position.set(d.u*R, y, d.v*R); m.rotation.y = (d.rot||0)*Math.PI/180*3; m.scale.setScalar(1.6);
    m.traverse(o => { if (o.isMesh){ o.castShadow = true; o.userData.deco = idx; } });
    parts.decos.add(m);
  });
}
function buildSprinkles(c){
  const cols = {}; c.sprinkles.forEach((list, i) => list.forEach(s => (cols[s.col] = cols[s.col] || []).push([i, s])));
  const M = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), sc = new THREE.Vector3(.028, .05, .028);
  for (const k in cols){ const L = cols[k], im = new THREE.InstancedMesh(capG, std('sp'+k, {color:col(k), roughness:.35}), L.length);
    L.forEach(([i, s], n) => { e.set(Math.PI/2, s.a*Math.PI/180, 0); q.setFromEuler(e); M.compose(new THREE.Vector3(s.u*R3[i], topY(c, i) + .012, s.v*R3[i]), q, sc); im.setMatrixAt(n, M); });
    im.castShadow = true; parts.sprinkles.add(im); }
}
function buildText(c){
  if (!c.text) return;
  const i = c.tiers-1, R = R3[i], fr = hasFrost(c) && (c.frostFull || c.cover>.5) ? FROST[c.frost].c : spongeColor(c);
  const dark = lum(fr) < .5, cv = mkCanvas(1024, 256, (g, w, h) => {
    g.font = `150px Jua, 'Malgun Gothic', sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    let fs = 150; while (g.measureText(c.text).width > w*.92 && fs > 40){ fs -= 8; g.font = `${fs}px Jua, 'Malgun Gothic', sans-serif`; }
    g.lineJoin = 'round'; g.lineWidth = fs*.16; g.strokeStyle = dark ? '#5a2a10' : '#ffffff'; g.strokeText(c.text, w/2, h/2+6);
    g.fillStyle = dark ? '#fff6e8' : '#d81b60'; g.fillText(c.text, w/2, h/2);
    g.fillStyle = 'rgba(255,255,255,.55)'; g.font = `${fs}px Jua, 'Malgun Gothic', sans-serif`; g.save(); g.globalCompositeOperation = 'source-atop'; g.fillRect(0, h/2 - fs*.42, w, fs*.16); g.restore(); });
  const t = texOf(cv); t.flipY = true;
  const p = new THREE.Mesh(new THREE.PlaneGeometry(1.6*R, .4*R), new THREE.MeshPhysicalMaterial({map:t, transparent:true, alphaTest:.2, roughness:.2, clearcoat:1}));
  p.rotation.x = -Math.PI/2; p.position.set(0, topY(c, i) + .004, R*.05); p.receiveShadow = true; parts.text.add(p);
}

/* ---------- 다시 그리기 (바뀐 부분만) ---------- */
let current = null;
C3D.sync = (c, which = ['tiers','dollops','decos','sprinkles','text']) => {
  current = c;
  which.forEach(k => { const g = parts[k]; while (g.children.length){ const o = g.children.pop(); if (o.isInstancedMesh) o.dispose(); } });
  if (which.includes('tiers')){ pickables.length = 0; buildTiers(c); }
  if (which.includes('dollops')) buildDollops(c);
  if (which.includes('decos')) buildDecos(c);
  if (which.includes('sprinkles')) buildSprinkles(c);
  if (which.includes('text')) buildText(c);
  frame(); dirty = true;
};
// 크림을 처음 바르기 시작하면 크림 층을 보이게
C3D.showCream = c => parts.tiers.children.forEach(m => { if (!m.userData.sponge) m.visible = true; });

/* ---------- 카메라 · 화면 붙이기 ---------- */
let host = null, kind = 'play', yaw = 0, auto = false, ro = null;
function frame(){
  const c = current; if (!c) return;
  const top = tierBase(c.tiers-1) + H3[c.tiers-1] + .35;
  const aspect = camera.aspect, fitW = 4.4, fitH = top + .3;
  const vfov = camera.fov*Math.PI/180, dW = fitW/2/Math.tan(vfov/2)/aspect, dH = fitH/2/Math.tan(vfov/2)*1.15;
  const dist = Math.max(dW, dH) * (kind==='title' ? 1.12 : kind==='result' ? 1.05 : 1.22) + 1.2;
  const el = kind==='play' ? .5 : .42, ty = top*.45 + (kind==='play' ? .05 : 0);
  camera.position.set(0, ty + Math.sin(el)*dist, Math.cos(el)*dist); camera.lookAt(0, ty, 0);
}
function size(){
  if (!host) return;
  const w = host.clientWidth || 600, h = host.clientHeight || 400;
  renderer.setPixelRatio(Math.min(LITE ? 1.5 : 2.5, (devicePixelRatio||1) * (typeof SCALE==='number' && SCALE>1 ? SCALE : 1)));
  dirty = true;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix(); frame();
}
C3D.mount = (el, c, k = 'play') => {
  if (host !== el){ el.appendChild(canvas); host = el; ro && ro.disconnect(); ro = new ResizeObserver(size); ro.observe(el); }
  kind = k; auto = k !== 'play'; if (k !== 'play') yaw = -.5;
  size(); C3D.sync(c);
  renderer.setAnimationLoop(loop);
};
C3D.unmount = () => { renderer.setAnimationLoop(null); canvas.remove(); host = null; ro && ro.disconnect(); ro = null; };
C3D.host = () => host;
C3D.turn = d => { yaw += d; dirty = true; };
function loop(t){
  if (!host || !host.isConnected){ C3D.unmount(); return; }
  if (auto){ yaw += .005; dirty = true; }
  root.rotation.y = yaw;
  let flames = false;
  parts.decos.traverse(o => { if (o.userData.flame){ flames = true; const f = 1 + Math.sin(t*.025 + o.id)*.08 + Math.sin(t*.041)*.05; o.scale.set(1/f, f, 1/f); } });
  if (!dirty && !flames) return;      // 바뀐 게 없으면 그리지 않아요 (배터리·끊김 절약)
  dirty = false;
  renderer.render(scene, camera);
}
/* 작은 케이크 사진 (타이틀 진열장용) */
C3D.snapshot = (c, w, h) => {
  const keep = {host, kind, yaw, cur:current};
  renderer.setPixelRatio(1); renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
  kind = 'result'; yaw = -.5; root.rotation.y = yaw; C3D.sync(c);
  renderer.render(scene, camera); const url = canvas.toDataURL('image/png');
  kind = keep.kind; yaw = keep.yaw; if (keep.cur) C3D.sync(keep.cur); size();
  return url;
};
/* 과일 아이콘 사진: 3D 과일 모형 하나만 투명 배경에 찍어요 (토핑 칸·재료 칸 아이콘으로 써요) */
C3D.iconShot = (type, px = 160) => {
  const make = MODELS[type]; if (!make) return null;
  const groups = Object.values(parts), vis = groups.map(g => g.visible);
  groups.forEach(g => g.visible = false); ground.visible = false;
  const m = make({}, 0); m.scale.setScalar(1.6); root.add(m); root.rotation.y = -.4; root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(m), ctr = box.getCenter(new THREE.Vector3()), rad = box.getBoundingSphere(new THREE.Sphere()).radius;
  const cam = new THREE.PerspectiveCamera(30, 1, .01, 50), dist = rad/Math.sin(15*Math.PI/180)*.8;
  cam.position.set(ctr.x, ctr.y + dist*.5, ctr.z + dist*.87); cam.lookAt(ctr);
  const ex = renderer.toneMappingExposure; renderer.toneMappingExposure = .88;   // 아이콘은 색을 조금 더 진하게
  renderer.setPixelRatio(1); renderer.setSize(px, px, false); renderer.render(scene, cam);
  const url = canvas.toDataURL('image/png'); renderer.toneMappingExposure = ex;
  root.remove(m); groups.forEach((g, i) => g.visible = vis[i]); ground.visible = true; root.rotation.y = yaw; size(); dirty = true;
  return url;
};

/* ---------- 누른 자리 찾기 ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function setRay(e){ const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left)/r.width*2 - 1, -(e.clientY - r.top)/r.height*2 + 1); ray.setFromCamera(ndc, camera); }
// 케이크(단) 위 → {tier, part, uv, u, v, y}
C3D.hit = e => {
  setRay(e); const h = ray.intersectObjects(pickables, false)[0]; if (!h) return null;
  const p = root.worldToLocal(h.point.clone()), d = h.object.userData;
  return {tier:d.tier, part:d.part, uv:h.uv, u:p.x/R3[d.tier], v:p.z/R3[d.tier], y:p.y, local:p};
};
// 놓아 둔 토핑 / 짠 크림
C3D.hitDeco = e => { setRay(e); const h = ray.intersectObjects(parts.decos.children, true)[0]; return h ? h.object.userData.deco : null; };
C3D.hitDollop = e => { setRay(e); const h = ray.intersectObjects(parts.dollops.children, false)[0]; return h ? h.object.userData.dollop : null; };
// 각 단 아래 둘레 근처면 그 자리 (조개 크림용)
C3D.baseHit = (e, c) => {
  setRay(e); const sd = shapeData(c.shape); let best = null, bd = .22;
  for (let i=0;i<c.tiers;i++){
    const plane = new THREE.Plane(new THREE.Vector3(0,1,0), -tierBase(i)), pt = new THREE.Vector3();
    const local = ray.ray.clone(); local.applyMatrix4(new THREE.Matrix4().copy(root.matrixWorld).invert());
    if (!local.intersectPlane(plane, pt)) continue;
    const j = nearestIdx(sd, pt.x/R3[i], pt.z/R3[i]), [u, v] = sd.pts[j], dd = Math.hypot(u*R3[i] - pt.x, v*R3[i] - pt.z);
    if (dd < bd){ bd = dd; best = {tier:i, u:u*1.03, v:v*1.03, base:true, shell:true, j}; }
  }
  return best;
};
C3D.overCake = e => { setRay(e); return ray.intersectObjects(root.children, true).length > 0; };

C3D.ok = true;
window.on3DReady && window.on3DReady();
}
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="모아 케이크">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffc2d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>모아의 케이크 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff8fb1;--pink-d:#e85d8a;--cream:#fff7ec;--ink:#6a3a4c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
html{background:#ffd6e3;color-scheme:light}
body{font-family:"Jua","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;position:fixed;inset:0;
  background:#ffe3ec radial-gradient(circle at 12px 12px,#ffd0df 5px,transparent 6px) 0 0/44px 44px}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input{font-family:inherit;user-select:text;-webkit-user-select:text}
svg.ic{width:1em;height:1em;vertical-align:-.15em;overflow:visible}
/* 화면 크기에 맞춰 통째로 확대·축소 (fit() 참고). 가로 화면 960×600, 휴대폰 세로 화면 620×1070 */
/* #stage가 화면 밖으로 넘치는 부분을 잘라 줘요 (휴대폰 iframe이 게임 원래 크기만큼 늘어나 잘리는 문제 방지) */
#stage{position:fixed;inset:0;overflow:hidden;contain:strict}
#game{width:960px;height:600px;position:absolute;left:0;top:0;transform-origin:0 0;background:var(--cream);border-radius:24px;overflow:hidden;
  box-shadow:0 10px 0 #eaa5bb,0 24px 50px rgba(150,60,90,.28)}
#game.portrait{width:620px;height:1070px}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}

/* ---------- title ---------- */
#title{background:linear-gradient(#ffd6e3,#fff3e6)}
#title h1{position:absolute;left:50px;top:52px;margin:0;font-size:58px;line-height:1.08;color:#fff;font-weight:normal;z-index:2;
  text-shadow:0 4px 0 #e5628c,0 8px 0 #c94f78,0 14px 18px rgba(160,50,90,.35)}
#title h1 em{font-style:normal;color:#fff6a8}
#title .sub{position:absolute;left:54px;top:182px;width:320px;font-size:18px;line-height:1.35;margin:0;color:#b4506f}
#title .rank{position:absolute;left:54px;top:254px;font-size:15px;color:#fff;background:#ff8fb1;border-radius:999px;padding:3px 12px;box-shadow:0 3px 0 #e06b93}
#titleBomi{position:absolute;left:340px;top:196px;width:220px;height:302px;z-index:1;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(160,60,90,.2))}
#titleBomi svg{width:100%;height:100%}
#titleSay{position:absolute;left:470px;top:78px;width:210px;background:#fff;border-radius:18px;padding:10px 14px;font-size:16px;line-height:1.4;color:#b2456c;box-shadow:0 4px 0 #f0b6c8;z-index:2}
#titleSay:after{content:"";position:absolute;left:30px;bottom:-14px;border:10px solid transparent;border-top:16px solid #fff;border-bottom:0}
#title .menu{position:absolute;left:50px;top:296px;display:flex;flex-direction:column;gap:14px;z-index:2}
#title .menu button{width:300px;padding:14px 20px;font-size:24px;border:none;border-radius:20px;background:#fff;color:#d24d7a;text-align:left;
  box-shadow:0 6px 0 #f0a8c0;transition:transform .1s;display:flex;align-items:center;gap:10px}
#title .menu button svg.ic{font-size:30px}
#title .menu button:hover{transform:translateY(-3px)}
#title .menu button:active{transform:translateY(3px);box-shadow:0 2px 0 #f0a8c0}
#title .stat{position:absolute;left:56px;bottom:30px;font-size:18px;color:#a0566e}
#titleCake{position:absolute;right:-6px;top:150px;width:430px;height:400px}
.floaty{position:absolute;font-size:34px;opacity:.6;animation:floaty 6s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-16px) rotate(10deg)}}

/* ---------- play ---------- */
#hdr{position:absolute;left:0;top:0;right:0;height:64px;display:flex;align-items:center;padding:0 14px;gap:10px;
  background:linear-gradient(#ffb5ca,#ff98b7);color:#fff}
#hdr .logo{font-size:20px;text-shadow:0 2px 0 #df6890;white-space:nowrap;display:flex;align-items:center;gap:6px}
#hdr .logo svg.ic{font-size:30px}
#hdr .logo small{display:block;font-size:11px;opacity:.9;text-shadow:none;margin-top:-1px}
.logoFace{width:44px;height:44px;border-radius:50%;background:#fff;overflow:hidden;flex:none;box-shadow:0 2px 0 #e07b9c}
.logoFace svg{width:100%;height:100%;transform:scale(1.25) translateY(9%)}
#bomi{position:absolute;left:4px;top:2px;width:84px;height:94px;z-index:3;pointer-events:none;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(160,60,90,.25))}
#bomi svg{width:100%;height:100%}
#steps{display:flex;gap:5px}
#steps span{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.3);font-size:14px;white-space:nowrap}
#steps span.on{background:#fff;color:var(--pink-d);box-shadow:0 3px 0 #e07b9c}
#steps span.done{background:rgba(255,255,255,.65);color:#d9789a}
#hdr .coins{margin-left:auto;background:#fff;color:#c98a00;padding:5px 12px;border-radius:999px;font-size:17px;white-space:nowrap;display:flex;align-items:center;gap:5px}
#hdr .coins svg.ic{font-size:20px}
#hdr .home{border:none;background:rgba(255,255,255,.35);color:#fff;border-radius:12px;padding:6px 10px;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:4px}
#work{position:absolute;left:16px;top:78px;width:600px;height:508px}
#viewWrap{position:relative;width:600px;height:400px;border-radius:20px;overflow:hidden;box-shadow:inset 0 0 0 4px #ffd1de}
#view{display:block;width:600px;height:400px;touch-action:none}
/* 모아 옆 '?' 버튼: 마우스를 올리면(휴대폰은 누르면) 설명 말풍선이 나와요 */
#help{position:absolute;left:84px;top:30px;width:30px;height:30px;border-radius:50%;border:3px solid #fff;background:#ff8fb1;color:#fff;font-size:17px;line-height:1;padding:0;
  z-index:4;box-shadow:0 3px 0 #e06b93;cursor:help}
#help.pulse{animation:helpPulse .7s ease-in-out 4}
@keyframes helpPulse{50%{transform:scale(1.28);background:#ff6f9b}}
#hint{position:absolute;left:124px;top:16px;max-width:330px;background:#fff;padding:8px 14px;border-radius:16px;z-index:5;
  font-size:15px;line-height:1.35;color:#b2456c;box-shadow:0 3px 0 rgba(230,140,170,.45),0 6px 16px rgba(160,60,90,.18);pointer-events:none;
  opacity:0;transform:translateX(-6px) scale(.96);transform-origin:left center;transition:opacity .15s,transform .15s;visibility:hidden}
#help:hover + #hint, #help:focus-visible + #hint, #hint.show{opacity:1;transform:none;visibility:visible}
#hint:before{content:"";position:absolute;left:-11px;top:14px;border:7px solid transparent;border-right:12px solid #fff;border-left:0}
#hint b.who{color:#ff6f9b;font-weight:normal;margin-right:4px}
#meter{position:absolute;right:14px;top:52px;width:160px;background:rgba(255,255,255,.92);border-radius:12px;padding:6px 10px;font-size:14px;color:#b2456c;pointer-events:none;display:none}
#meter .bar{position:relative;height:12px;background:#ffe0ea;border-radius:6px;margin-top:4px;overflow:hidden}
#meter .bar i{position:relative;display:block;height:100%;background:linear-gradient(90deg,#ff9ab8,#ff6f9b);border-radius:6px;width:0;z-index:1}
#meterZone{position:absolute;top:0;bottom:0;z-index:2;display:none;border-left:2px solid #2e9b58;border-right:2px solid #2e9b58;background:rgba(80,200,120,.35)}
#toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;background:#fff;color:#d24d7a;font-size:26px;
  padding:12px 26px;border-radius:20px;box-shadow:0 6px 0 #f0a8c0;pointer-events:none;transition:all .2s;white-space:nowrap;z-index:5}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#tray{margin-top:8px;height:100px;background:#fff;border-radius:20px;box-shadow:0 4px 0 #f3c6d3;display:flex;align-items:center;padding:6px 12px;gap:10px}
.rows{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.row{display:flex;align-items:center;gap:6px}
.row>b{width:40px;font-weight:normal;font-size:15px;color:#c0577c;flex:none}
.row>b svg.ic{font-size:30px}
.tb{width:52px;height:40px;border:2px solid #ffd3e0;background:#fff8fa;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1;position:relative;flex:none;touch-action:manipulation}
.tb.drag,#hold{touch-action:none}
.tb svg.ic{font-size:21px}
.tb small{font-size:11px;color:#a86;margin-top:1px;white-space:nowrap}
.tb:hover{border-color:#ff9ab8}
.tb:disabled{opacity:.45;cursor:default}
.tb.sel{border-color:#ff6f9b;background:#ffe3ec;box-shadow:0 0 0 2px #ffb3c9}
.tb.drag{cursor:grab}
.tb .cnt{position:absolute;right:-6px;top:-7px;background:#ff6f9b;color:#fff;font-size:11px;border-radius:9px;padding:1px 5px}
.tb.wide{width:auto;padding:0 10px;flex-direction:row;gap:4px;font-size:15px}
.sw{width:39px;height:auto;border:none;background:none;flex:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.sw i{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #f2d0db;display:flex;align-items:center;justify-content:center}
.sw i svg.ic{font-size:18px;filter:drop-shadow(0 1px 1px rgba(80,30,40,.35))}
.sw small{font-size:10px;letter-spacing:-.3px;line-height:1;color:#a0506c;white-space:nowrap}
.sw.sel i{box-shadow:0 0 0 3px #ff6f9b}
.sw.none{background:#fff;color:#d99;font-size:16px}
.next{flex:none;border:none;border-radius:18px;background:linear-gradient(#ff9ab8,#ff6f9b);color:#fff;font-size:22px;padding:14px 18px;box-shadow:0 5px 0 #d4507b;touch-action:manipulation;display:flex;align-items:center;gap:6px;justify-content:center}
.next svg.ic{font-size:26px}
.next:active{transform:translateY(3px);box-shadow:0 2px 0 #d4507b}
.next:disabled{background:#e9dfe3;box-shadow:0 5px 0 #d5c8cd;color:#fff;cursor:default}
.next.fire{background:linear-gradient(#ffb36b,#ff7a3d);box-shadow:0 5px 0 #d45c22}
.next.mint{background:linear-gradient(#8fe0c0,#4cc79a);box-shadow:0 5px 0 #2f9a72}
.next.small{font-size:15px;padding:9px 12px}
.tb.sm{width:47px}
.row .sep{width:2px;height:30px;background:#ffd3e0;border-radius:2px;flex:none}
.topwrap{display:flex;flex-direction:column;gap:4px;width:332px;flex:none}
.tabs{display:flex;gap:4px}
.tab{border:none;background:#ffe9f0;color:#c0577c;border-radius:8px;padding:2px 12px;font-size:13px}
.tab.on{background:#ff8fb1;color:#fff}
.topgrid{display:grid;grid-template-columns:repeat(7,44px);gap:4px}
.top{width:44px;height:32px;border:2px solid #ffd3e0;background:#fff8fa;border-radius:10px;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.tool{display:flex;flex-direction:column;gap:6px}
.tool .tb{width:auto;height:36px;padding:0 10px;flex-direction:row;gap:4px;font-size:13px;white-space:nowrap}
.tool .tb svg.ic{font-size:16px}
.top:hover{border-color:#ff9ab8;transform:scale(1.08)}
.rbtns .next{white-space:nowrap}
/* 캐릭터가 바닥에서 살짝 떠 보이도록 그림자 */
.face svg,.introBomi svg,.howFace svg,.r3d .rBomi,#logoFace svg{filter:drop-shadow(0 3px 2px rgba(90,30,50,.32)) drop-shadow(0 0 1px rgba(90,30,50,.25))}
/* 3D 케이크 캔버스: 주방 그림 위에 겹쳐요 (누르기는 아래 #view가 받아요) */
#gl,#fxView{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#fxView{z-index:2}
.gl3d{display:block;width:100%;height:100%}
#titleCake>svg{width:100%;height:100%;display:block}
.r3d{width:470px;height:500px;flex:none;border-radius:20px;background:radial-gradient(circle at 50% 45%,#fff6d8,#ffe0ea);position:relative;overflow:hidden;box-shadow:0 0 0 3px var(--ol)}
.r3d #resGL{position:absolute;inset:0}
.r3d .rBomi{position:absolute;right:6px;bottom:4px;width:132px;height:180px;pointer-events:none}
#game.fluid .r3d .rSay{bottom:41%;right:3%;font-size:12px}
.r3d .rSay{position:absolute;right:16px;bottom:188px;background:#fff;border:2px solid #ffd3e0;border-radius:14px;padding:5px 12px;color:#d24d7a;font-family:Jua,sans-serif;font-size:15px;pointer-events:none}
.r3d .rSpin{position:absolute;left:12px;bottom:10px;font-size:12px;color:#b98;background:rgba(255,255,255,.8);border-radius:99px;padding:3px 10px;pointer-events:none}
#game.fluid .r3d{width:100%;height:auto;aspect-ratio:520/450}
#game.fluid .r3d .rBomi{width:24%;height:auto;aspect-ratio:200/272}
.top svg{filter:drop-shadow(0 1.5px 1px rgba(107,42,60,.32))}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.decoCtl{display:flex;flex-direction:column;gap:6px;width:116px;flex:none}
.decoCtl input{width:100%;border:2px solid #ffd3e0;border-radius:10px;padding:5px 8px;font-size:16px;color:var(--ink);outline:none}
.decoCtl input:focus{border-color:#ff9ab8}
.gauge{position:relative;flex:1;height:40px;border-radius:12px;overflow:hidden;
  background:linear-gradient(90deg,#fff2b3 0,#ffe08a 55%,#9be08f 55%,#6fd27d 72%,#ff9f7a 72%,#5a2a1a 100%)}
.gauge span{position:absolute;top:11px;font-size:13px;color:rgba(80,40,30,.75)}
.gauge #needle{position:absolute;top:-4px;width:6px;height:48px;background:#fff;border:2px solid #6a3a4c;border-radius:4px;left:0;transform:translateX(-3px)}
.msg{flex:1;font-size:16px;color:#b2456c;line-height:1.4}

#side{position:absolute;left:632px;top:78px;width:312px;height:508px}
.card{height:100%;background:#fff;border-radius:20px;box-shadow:0 4px 0 #f3c6d3;padding:12px 16px;position:relative}
.cust{display:flex;align-items:flex-end;gap:10px}
.face{width:84px;height:91px;flex:none;animation:bob 2s ease-in-out infinite;border-radius:50% 50% 16px 16px;background:radial-gradient(circle at 50% 60%,#fff1f5 60%,transparent 61%)}
.face svg{width:100%;height:100%}
@keyframes bob{50%{transform:translateY(-4px)}}
.cname{font-size:18px;color:#c0577c;margin-left:auto;text-align:right}
.bubble{margin-top:8px;background:#fff1f5;border-radius:16px;padding:10px 12px;font-size:16px;position:relative;line-height:1.35}
.bubble:before{content:"";position:absolute;left:34px;top:-10px;border:10px solid transparent;border-top:0;border-bottom-color:#fff1f5}
.ord{list-style:none;margin:10px 0 0;padding:0;font-size:16px}
.ord li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:2px dashed #ffe0ea}
.ord li svg.ic{font-size:22px}
.ord li b{font-weight:normal;color:#c0577c;width:46px;flex:none}
.ord .ok{margin-left:auto;color:#3cb371;font-style:normal}
.ord .no{margin-left:auto;color:#e57373;font-style:normal;font-size:13px}
.chip{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid #eee;vertical-align:-3px}
.pat{position:absolute;left:16px;right:16px;bottom:14px;font-size:14px;color:#c0577c}
.pat .bar{height:12px;background:#ffe0ea;border-radius:8px;overflow:hidden;margin-top:4px}
.pat .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7ed98b,#b8e986);transition:width .25s}
.tips{margin:12px 0 0;padding-left:20px;font-size:15px;line-height:1.7}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;background:rgba(90,40,60,.45);display:none;align-items:center;justify-content:center;z-index:20}
#modal.on{display:flex}
.panel{background:#fff;border-radius:26px;box-shadow:0 8px 0 #f0a8c0;padding:20px 24px;position:relative;animation:pop .3s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.result{width:880px;height:540px;display:flex;gap:16px}
.result>svg{width:470px;height:500px;flex:none;border-radius:20px;background:radial-gradient(circle at 50% 45%,#fff6d8,#ffe0ea)}
.rinfo{flex:1;display:flex;flex-direction:column}
.stars{font-size:34px;letter-spacing:4px;margin:4px 0 0;color:#ffc93c;text-shadow:0 2px 0 #e0a100}
.stars .off{color:#eee;text-shadow:none}
table.sc{width:100%;border-collapse:collapse;font-size:14px;margin-top:2px}
table.sc td{padding:2px 4px;border-bottom:1px dashed #ffd6e2}
table.sc td:nth-child(2){color:#999;font-size:12px}
table.sc td:last-child{text-align:right;color:#d24d7a;white-space:nowrap}
.total{font-size:22px;margin-top:6px;display:flex;justify-content:space-between;align-items:center}
.total .coin{color:#c98a00;display:flex;align-items:center;gap:4px}
.rbtns{margin-top:auto;display:flex;gap:10px}
.rbtns .next{flex:1}
.how{width:660px;font-size:17px;line-height:1.55}
.how h2{margin:0 0 8px;color:#d24d7a;font-weight:normal;display:flex;align-items:center;gap:8px}
.howFace{width:56px;height:62px;flex:none}.howFace svg{width:100%;height:100%}
.intro{width:660px;height:390px;display:flex;gap:18px;align-items:flex-end;background:linear-gradient(#fff,#fff4f8)}
.introBomi{width:200px;height:275px;flex:none;animation:bob 2.2s ease-in-out infinite}.introBomi svg{width:100%;height:100%}
.introTalk{flex:1;align-self:center;background:#fff1f5;border-radius:22px;padding:18px 22px;position:relative;box-shadow:0 4px 0 #ffd3e0}
.introTalk:before{content:"";position:absolute;left:-16px;top:40px;border:10px solid transparent;border-right:16px solid #fff1f5;border-left:0}
.introTalk .who{font-size:22px;color:#ff6f9b}.introTalk .who small{font-size:13px;color:#b98;margin-left:6px}
.introTalk p{font-size:20px;line-height:1.55;margin:8px 0 18px;min-height:94px}
.introTalk .foot{display:flex;align-items:center;justify-content:space-between}
.dots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ffd3e0;margin-right:6px}.dots i.on{background:#ff6f9b}
.rankup{margin-top:6px;background:#fff6d6;border-radius:12px;padding:6px 10px;color:#b07a00;font-size:16px;display:flex;align-items:center;gap:6px}
.rankup svg.ic{font-size:22px}
.how ol{padding-left:22px;margin:6px 0 14px}
.confetti{position:absolute;top:-30px;width:22px;height:22px;pointer-events:none;z-index:30;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(680px) rotate(540deg)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .25s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(.85,1.12) skewX(4deg)}}
.ghost{position:fixed;pointer-events:none;z-index:100;transform:translate(-50%,-70%);filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.ghost svg{width:100%;height:100%}
.top.sel{border-color:#ff6f9b;background:#ffe3ec;box-shadow:0 0 0 3px #ffb3c9;transform:scale(1.06)}

/* =====================================================================
   게임 스킨 — 진한 초콜릿색 윤곽선 + 사탕처럼 볼록한 버튼 + 나무 선반 + 종이 주문서
   ===================================================================== */
:root{--ol:#6b2a3c;--ol2:#8f4a5e;--rose:#ff7aa2;--rose2:#ffa8c4;--gold:#ffcf4a;--gold2:#fff1a8;--wood1:#f7d6ab;--wood2:#e9b67e;--wood3:#9a5f33;--paper:#fffdf6}
body{background:#2b1620 radial-gradient(1100px 700px at 50% 42%,#5d2c40 0,#2b1620 72%)}
#game{box-shadow:0 0 0 4px var(--ol),0 0 0 10px #ffb3c9,0 0 0 14px var(--ol),0 30px 70px rgba(0,0,0,.55)}
/* 위쪽 머리말 */
#hdr{background:radial-gradient(rgba(255,255,255,.16) 2px,transparent 2.6px) 0 0/18px 18px,linear-gradient(#ffa4c1,#ff7aa2 62%,#f0628f);
  border-bottom:3px solid var(--ol);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 4px 0 rgba(107,42,60,.25);z-index:5}
#hdr .logo>span:last-child{text-shadow:0 2px 0 var(--ol),2px 0 0 var(--ol),-2px 0 0 var(--ol),0 -2px 0 var(--ol),2px 2px 0 var(--ol),-2px 2px 0 var(--ol),0 4px 0 rgba(107,42,60,.4)}
.logoFace{box-shadow:0 0 0 3px var(--ol),0 3px 0 3px rgba(107,42,60,.35)}
#steps span{background:rgba(255,255,255,.22);border:2px solid rgba(107,42,60,.35);text-shadow:0 1px 0 rgba(107,42,60,.6)}
#steps span.on{background:linear-gradient(var(--gold2),var(--gold));color:var(--ol);border-color:var(--ol);box-shadow:0 3px 0 var(--ol),0 0 14px rgba(255,220,120,.9);text-shadow:none}
@keyframes stepGlow{50%{box-shadow:0 3px 0 var(--ol),0 0 22px rgba(255,230,140,1)}}
#steps span.done{background:rgba(255,255,255,.75);color:var(--ol2);border-color:rgba(107,42,60,.25);text-shadow:none}
#hdr .coins{background:linear-gradient(#fffbe8,#ffe7a0);border:2px solid var(--ol);color:var(--ol);box-shadow:0 3px 0 var(--ol)}
#hdr .home,.snd{border:2px solid var(--ol);background:linear-gradient(#fff,#ffe3ec);color:var(--ol);box-shadow:0 3px 0 var(--ol)}
#hdr .home:active,.snd:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ol)}
#hdr .home svg.ic path:first-child{stroke:var(--ol)}#hdr .home svg.ic path:nth-child(2){fill:var(--ol)}
#game:not(.fluid) .tb.sm{width:44px}#game:not(.fluid) .tb.sm small{font-size:10px}
.snd{width:34px;height:34px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.snd svg.ic{font-size:20px}
/* 작업대 액자 + 가장자리 어둡게(비네트) */
#viewWrap{border-radius:18px;box-shadow:0 0 0 3px var(--ol),0 0 0 7px #ffd7e3,0 0 0 10px var(--ol),0 8px 0 10px rgba(0,0,0,.12)}
#viewWrap::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;z-index:1;background:radial-gradient(ellipse at 50% 42%,transparent 58%,rgba(90,30,40,.22))}
#meter{z-index:3;border:2px solid var(--ol);box-shadow:0 3px 0 var(--ol);background:linear-gradient(#fff,#fff2f6)}
#meter .bar{border:1px solid rgba(107,42,60,.3)}
#toast{border:3px solid var(--ol);box-shadow:0 5px 0 var(--ol),0 12px 24px rgba(0,0,0,.25);background:linear-gradient(#fff,#ffeef4);color:var(--ol)}
#hint{border:2px solid var(--ol);box-shadow:0 3px 0 var(--ol),0 8px 18px rgba(0,0,0,.18)}
#hint:before{left:-13px;border-right-color:var(--ol)}
#help{border-color:#fff;box-shadow:0 0 0 2px var(--ol),0 3px 0 2px var(--ol)}
/* 나무 선반(도구 칸) */
#tray{margin-top:13px;background:repeating-linear-gradient(90deg,rgba(120,70,30,.05) 0 2px,transparent 2px 26px),linear-gradient(var(--wood1),var(--wood2));
  box-shadow:0 0 0 3px var(--ol),inset 0 3px 0 rgba(255,255,255,.55),inset 0 -6px 0 rgba(120,60,20,.22),0 7px 0 3px rgba(0,0,0,.15);border-radius:16px}
#game:not(.fluid) #tray{height:95px}
.row>b{color:var(--ol);text-shadow:0 1px 0 rgba(255,255,255,.8)}
.msg{color:var(--ol)}
/* 아이템 칸 */
.tb,.top{background:radial-gradient(circle at 50% 35%,#fffdf8,#ffecd9);border:2px solid #c98b5c;box-shadow:inset 0 -3px 0 rgba(160,90,40,.18),0 2px 0 rgba(107,42,60,.3);transition:transform .1s,box-shadow .1s}
.tb small{color:#8a5a3a}
.tb:hover:not(:disabled),.top:hover{border-color:#e8a900;box-shadow:0 0 0 3px rgba(255,207,74,.65),0 2px 0 rgba(107,42,60,.3);transform:translateY(-1px)}
.tb.sel,.top.sel{border-color:var(--rose);background:radial-gradient(circle at 50% 35%,#fff,#ffe1ec);box-shadow:0 0 0 3px #ffb3c9,0 0 12px rgba(255,120,160,.6)}
.tb .cnt{background:var(--rose);border:2px solid #fff;box-shadow:0 1px 0 var(--ol)}
.tb.wide{color:var(--ol)}
.sw i{border:3px solid #fff;box-shadow:0 0 0 2px var(--ol2),inset 0 -4px 0 rgba(0,0,0,.12)}
.sw.sel i{box-shadow:0 0 0 3px var(--gold),0 0 0 5px var(--ol),inset 0 -4px 0 rgba(0,0,0,.12)}
.sw.sel small{color:var(--ol);font-weight:bold}
.tab{border:2px solid var(--ol2);background:#fff6ea;color:var(--ol)}
.tab.on{background:linear-gradient(var(--gold2),var(--gold));border-color:var(--ol);color:var(--ol);box-shadow:0 2px 0 var(--ol)}
.decoCtl input{border-color:#c98b5c;background:#fffdf8}
.gauge{border:3px solid var(--ol);box-shadow:inset 0 3px 0 rgba(255,255,255,.4)}
/* 사탕 버튼 */
.next{position:relative;overflow:hidden;background:linear-gradient(#ffb0c9,#ff6f98);border:3px solid var(--ol);
  box-shadow:inset 0 4px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(150,30,70,.25),0 5px 0 var(--ol);text-shadow:0 2px 0 rgba(107,42,60,.6)}
.next::after{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .5s}
.next:hover:not(:disabled)::after{left:120%}
.next:hover:not(:disabled){filter:brightness(1.06)}
.next:active{transform:translateY(3px);box-shadow:inset 0 4px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(150,30,70,.25),0 2px 0 var(--ol)}
.next:disabled{background:linear-gradient(#efe4e8,#d8c9cf);border-color:#a8949c;box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 5px 0 #a8949c;text-shadow:none}
.next.fire{background:linear-gradient(#ffc27a,#ff7a3d);box-shadow:inset 0 4px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(150,60,0,.25),0 5px 0 var(--ol)}
.next.mint{background:linear-gradient(#9ef0d0,#3fbf8f);box-shadow:inset 0 4px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(0,90,60,.25),0 5px 0 var(--ol)}
/* 종이 주문서 + 테이프 */
.card{background:repeating-linear-gradient(transparent 0 29px,rgba(200,150,130,.18) 29px 30px),var(--paper);border-radius:8px 8px 16px 16px;
  box-shadow:0 0 0 3px var(--ol),0 9px 0 3px rgba(0,0,0,.14)}
.card::before{content:"";position:absolute;left:50%;top:-14px;width:110px;height:26px;transform:translateX(-50%) rotate(-3deg);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px),rgba(255,214,150,.85);box-shadow:0 2px 3px rgba(0,0,0,.15)}
.face{border-radius:18px;background:radial-gradient(circle at 50% 40%,#fff,#ffe1ea);box-shadow:0 0 0 3px var(--ol),0 4px 0 3px rgba(0,0,0,.12)}
.cname{color:var(--ol)}
.bubble{background:#fff;border:2px solid #f2b9ca}
.bubble:before{border-bottom-color:#f2b9ca}
.ord li{border-bottom-color:#ecd3c6}
.ord li b{color:var(--ol2)}
.pat .bar{border:2px solid var(--ol);height:14px}
/* 팝업 */
#modal{background:rgba(40,14,24,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.panel{background:linear-gradient(#fffaf4,#ffeef3);box-shadow:0 0 0 4px var(--ol),0 0 0 9px #ffc2d4,0 0 0 12px var(--ol),0 22px 46px rgba(0,0,0,.5)}
.result>svg{box-shadow:0 0 0 3px var(--ol)}
.stars{font-size:40px;text-shadow:0 3px 0 var(--ol),0 0 16px rgba(255,210,80,.8)}
.stars .off{color:#f3e6ea;text-shadow:0 3px 0 rgba(107,42,60,.25)}
.rankup{border:2px solid var(--ol);box-shadow:0 3px 0 var(--ol)}
/* 타이틀 */
#titleBg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#title h1{text-shadow:0 3px 0 var(--ol),3px 0 0 var(--ol),-3px 0 0 var(--ol),0 -3px 0 var(--ol),2px 2px 0 var(--ol),-2px 2px 0 var(--ol),2px -2px 0 var(--ol),-2px -2px 0 var(--ol),
  0 9px 0 #c94f78,3px 9px 0 #c94f78,-3px 9px 0 #c94f78,0 12px 0 var(--ol),0 18px 26px rgba(0,0,0,.35);animation:logoFloat 3.2s ease-in-out infinite;will-change:transform}
#title h1 em{color:var(--gold)}
@keyframes logoFloat{50%{transform:translateY(-6px) rotate(-.6deg)}}
#title .sub{background:rgba(255,255,255,.82);border:2px solid #f2b9ca;border-radius:14px;padding:6px 12px;color:var(--ol);z-index:1}
#title .rank{border:2px solid var(--ol);box-shadow:0 3px 0 var(--ol);text-shadow:0 1px 0 var(--ol);z-index:1}
#title .menu button{border:3px solid var(--ol);background:linear-gradient(#fff,#ffeef3);color:var(--ol);position:relative;overflow:hidden;
  box-shadow:inset 0 -6px 0 rgba(255,150,180,.35),0 6px 0 var(--ol)}
#title .menu button:first-child{background:linear-gradient(#ffb0c9,#ff6f98);color:#fff;text-shadow:0 2px 0 var(--ol);box-shadow:inset 0 4px 0 rgba(255,255,255,.45),inset 0 -6px 0 rgba(150,30,70,.25),0 6px 0 var(--ol)}
#title .menu button::after{content:"";position:absolute;top:-20%;bottom:-20%;width:30%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);transition:left .55s}
#title .menu button:hover::after{left:130%}
#title .menu button:hover{transform:translateY(-3px) scale(1.02)}
#title .menu button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ol)}
#title .menu button svg.ic{filter:drop-shadow(0 2px 0 rgba(107,42,60,.35))}
#title .stat{background:rgba(255,255,255,.82);border:2px solid #f2b9ca;border-radius:999px;padding:4px 12px;color:var(--ol);z-index:1}
#titleSay{border:3px solid var(--ol);box-shadow:0 4px 0 var(--ol)}
#titleSay:after{border-top-color:var(--ol)}
#titleBomi,#titleCake{filter:drop-shadow(0 10px 8px rgba(90,30,50,.28))}
#tMusic{position:absolute;right:16px;top:14px;z-index:3}
.floaty{z-index:1}
/* 시작 화면 · 화면 전환 · 단계 이름 · 반짝이 */
#fxCanvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:30}
#wipe{position:absolute;inset:0;z-index:35;pointer-events:none;opacity:0;
  background:radial-gradient(rgba(255,255,255,.35) 3px,transparent 3.6px) 0 0/34px 34px,radial-gradient(circle at 50% 50%,#ffd6e3,#ff8fb1)}
#wipe.run{animation:wipe .62s ease-in-out}
@keyframes wipe{0%{opacity:1;clip-path:circle(0% at 50% 50%)}45%,58%{opacity:1;clip-path:circle(80% at 50% 50%)}100%{opacity:0;clip-path:circle(80% at 50% 50%)}}
#splash{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .5s,transform .5s;
  background:radial-gradient(rgba(255,255,255,.25) 3px,transparent 3.6px) 0 0/40px 40px,radial-gradient(circle at 50% 38%,#ffe1ea,#ff9fbe 58%,#d9457a)}
#splash.hide{opacity:0;transform:scale(1.06);pointer-events:none}
.spl{text-align:center;color:#fff}
.splFace{width:150px;height:170px;margin:0 auto 6px;animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 10px 8px rgba(0,0,0,.25))}
.splFace svg{width:100%;height:100%}
.splTitle{font-size:58px;line-height:1.06;text-shadow:0 3px 0 var(--ol),3px 0 0 var(--ol),-3px 0 0 var(--ol),0 -3px 0 var(--ol),2px 2px 0 var(--ol),-2px 2px 0 var(--ol),0 10px 0 #c94f78,0 13px 0 var(--ol),0 20px 26px rgba(0,0,0,.35)}
.splTitle em{font-style:normal;color:var(--gold)}
.splTap{margin-top:26px;font-size:20px;animation:blink 1.3s ease-in-out infinite;text-shadow:0 2px 0 var(--ol)}
@keyframes blink{50%{opacity:.3}}
#stepBanner{position:absolute;left:0;right:0;top:40%;z-index:6;text-align:center;pointer-events:none;opacity:0}
#stepBanner.run{animation:banner 1.4s ease forwards}
#stepBanner span{display:inline-block;padding:8px 30px;font-size:26px;color:#fff;background:linear-gradient(#ffb0c9,#ff6f98);border:3px solid var(--ol);border-radius:999px;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 5px 0 var(--ol),0 10px 22px rgba(0,0,0,.25);text-shadow:0 2px 0 var(--ol)}
@keyframes banner{0%{opacity:0;transform:translateX(-80px) scale(.85)}16%{opacity:1;transform:none}78%{opacity:1;transform:none}100%{opacity:0;transform:translateX(80px) scale(.95)}}
#viewWrap.stepIn #view,#viewWrap.stepIn #bgView{animation:stepIn .45s ease}
@keyframes stepIn{from{opacity:.15;transform:scale(.965)}}
.beam{animation:beam 6s ease-in-out infinite}
/* 부드러운 움직임: 배경·흔들리는 캐릭터를 따로 된 층으로 (매 프레임 다시 칠하지 않게) */
#bgView{position:absolute;left:0;top:0;width:100%;height:100%;display:block;will-change:transform;pointer-events:none}
#view{position:relative;background:transparent}
#bomi,.face,#titleBomi,.introBomi,.splFace,.floaty,#toast,#stepBanner{will-change:transform}
@keyframes beam{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){#title h1,.beam,#steps span.on,.splTap{animation:none}}

/* =====================================================================
   휴대폰(좁은 화면·세로 화면): 확대·축소하지 않고 실제 크기로 위→아래 흐르는 배치.
   넘치는 부분은 스크롤로 볼 수 있어서 잘리지 않아요. (fit()이 #game에 .fluid를 붙여요)
   ===================================================================== */
#game.fluid{inset:0;width:auto;height:auto;transform:none!important;border-radius:0;box-shadow:none;
  overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
#game.fluid .screen{position:relative;inset:auto;min-height:100%}
/* 타이틀: 제목 → 모아 말풍선 → 모아 + 케이크 → 메뉴 */
#game.fluid #title{flex-flow:row wrap;align-items:flex-end;align-content:flex-start;gap:10px 0;padding:max(18px,env(safe-area-inset-top,0px)) 16px 24px}
#game.fluid #title.on{display:flex}
#game.fluid #title h1,#game.fluid #title .sub,#game.fluid #title .rank,#game.fluid #title .menu,#game.fluid #title .stat,
#game.fluid #titleBomi,#game.fluid #titleSay,#game.fluid #titleCake{position:static;left:auto;right:auto;top:auto;bottom:auto}
#game.fluid #title h1{order:1;flex:0 0 100%;font-size:clamp(34px,11vw,54px)}
#game.fluid #title .sub{order:2;flex:0 0 100%;width:auto;font-size:15px}
#game.fluid #title .rank{order:3;flex:0 0 auto}
#game.fluid #titleSay{order:4;flex:0 0 auto;width:auto;max-width:80%;margin:8px 0 6px 6%;font-size:14px}
#game.fluid #titleBomi{order:5;flex:0 0 40%;width:40%;height:auto;aspect-ratio:160/220}
#game.fluid #titleCake{order:6;flex:0 0 64%;width:64%;height:auto;aspect-ratio:600/560}
#game.fluid #title .menu{order:7;flex:0 0 100%;gap:10px;margin-top:8px}
#game.fluid #title .menu button{width:100%;font-size:20px;padding:13px 16px}
#game.fluid #title .stat{order:8;flex:0 0 100%;font-size:14px;margin-top:6px}
#game.fluid .floaty{display:none}
/* 플레이 화면: 머리말 → 작업대 → 도구 → 주문서 */
#game.fluid #hdr{position:sticky;top:0;z-index:10;height:auto;flex-wrap:wrap;row-gap:6px;padding:8px 12px}
#game.fluid #hdr .logo{font-size:16px}
#game.fluid .logoFace{width:36px;height:36px}
#game.fluid #steps{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding-bottom:2px}
#game.fluid #steps span{font-size:12px;padding:4px 9px;flex:none}
#game.fluid #work,#game.fluid #side{position:static;width:auto;height:auto;margin:10px 10px 0}
#game.fluid #viewWrap{width:100%;height:auto;aspect-ratio:3/2}
#game.fluid #view{width:100%;height:100%}
#game.fluid #bomi{width:54px;height:61px}
#game.fluid #help{left:50px;top:16px;width:26px;height:26px;font-size:15px;border-width:2px}
#game.fluid #hint{left:84px;top:8px;max-width:calc(100% - 96px);font-size:13px;padding:6px 10px}
#game.fluid #meter{right:8px;top:auto;bottom:8px;width:118px;font-size:12px;padding:4px 8px}
#game.fluid #toast{font-size:17px;padding:9px 16px}
#game.fluid #tray{height:auto;flex-wrap:wrap;padding:10px;gap:8px}
#game.fluid .rows{flex:1 1 100%}
#game.fluid .row{flex-wrap:wrap}
#game.fluid .row>b{width:34px}
#game.fluid .next{flex:1 1 100%;padding:12px;font-size:19px}
#game.fluid .next.small{flex:1 1 auto}
#game.fluid .tool{flex-direction:row;flex:1 1 100%}
#game.fluid .topwrap{width:100%;flex:1 1 100%}
#game.fluid .topgrid{grid-template-columns:repeat(auto-fill,minmax(42px,1fr))}
#game.fluid .top{width:auto;height:38px}
#game.fluid .decoCtl{flex:1 1 100%;flex-direction:row;width:auto}
#game.fluid .decoCtl input{flex:1;min-width:0}
#game.fluid .gauge,#game.fluid .msg{flex:1 1 100%}
#game.fluid .card{height:auto;padding-bottom:14px}
#game.fluid .pat{position:static;margin-top:12px}
#game.fluid #side{margin-bottom:max(16px,env(safe-area-inset-bottom,0px))}
/* 팝업: 화면 폭에 맞추고, 길면 안에서 스크롤 */
#game.fluid #modal{position:fixed;inset:0;padding:12px;overflow-y:auto;align-items:flex-start}
#game.fluid .panel{width:100%!important;height:auto!important;max-width:560px;margin:auto;padding:14px}
#game.fluid .result{flex-direction:column;gap:10px}
#game.fluid .result>svg{width:100%;height:auto;aspect-ratio:520/450}
#game.fluid .intro{gap:10px}
#game.fluid .introBomi{width:38%;height:auto;aspect-ratio:160/220}
#game.fluid .introTalk{padding:12px 14px}
#game.fluid .introTalk p{font-size:16px;min-height:0}
#game.fluid .how{font-size:15px}
#game.fluid .confetti{position:fixed}
#game.fluid #wipe,#game.fluid #splash,#game.fluid #fxCanvas{position:fixed}
#game.fluid .splTitle{font-size:44px}
#game.fluid .splFace{width:120px;height:136px}
#game.fluid #work{margin:16px 14px 0}
#game.fluid #side{margin:18px 14px 0}
#game.fluid #tray{margin-top:16px}
#game.fluid #tMusic{position:absolute;right:12px;top:max(12px,env(safe-area-inset-top,0px))}
#game.fluid #hdr .home{padding:5px 8px;font-size:13px}
/* 휴대폰 타이틀 한 화면 */
#game.fluid #title{gap:6px 0;padding:max(12px,env(safe-area-inset-top,0px)) 14px max(12px,env(safe-area-inset-bottom,0px));min-height:100%;align-content:flex-start}
#game.fluid #titleBg{position:absolute;inset:0;width:100%;height:100%}
#game.fluid #tbCakes{display:none}
#game.fluid #title h1{font-size:clamp(28px,8.6vw,40px);line-height:1.05}
#game.fluid #title .sub{display:none}
#game.fluid #title .rank{order:3;font-size:12px;padding:2px 10px}
#game.fluid #titleSay{order:4;flex:1 1 calc(100% - 150px);min-width:0;max-width:none;margin:0 0 0 8px;font-size:12.5px;padding:6px 10px;line-height:1.35}
#game.fluid #titleSay:after{display:none}
#game.fluid #titleBomi{order:5;flex:0 0 34%;width:34%;max-height:30vh}
#game.fluid #titleCake{order:6;flex:0 0 60%;width:60%;max-height:32vh;margin-left:4%}
#game.fluid #titleBomi,#game.fluid #titleCake{align-self:center}
#game.fluid #title .menu{order:7;gap:8px;margin-top:4px}
#game.fluid #title .menu button{font-size:18px;padding:10px 14px}
#game.fluid #title .stat{order:8;font-size:12px;margin-top:2px}
/* 휴대폰 도구 칸: 버튼이 넓은 줄(모양·단수 등)은 칸을 넓게 — 아이콘·글자가 겹치지 않게 */
#game.fluid .row.wide{grid-template-columns:30px repeat(auto-fill,minmax(62px,1fr))}
#game.fluid .row.wide .tb{width:auto;height:46px}
#game.fluid .tb small,#game.fluid .sw small,#game.fluid .card .ord li{overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* 휴대폰: 레시피(주문서)를 작업대 위에 작게 모아서 늘 보이게 */
#game.fluid #play.on{display:flex;flex-direction:column}
#game.fluid #hdr{order:0}
#game.fluid #side{order:1;margin:10px 14px 0}
#game.fluid #work{order:2;margin:12px 14px max(18px,env(safe-area-inset-bottom,0px))}
#game.fluid .card{padding:10px 12px}
#game.fluid .card .tips{display:none}
#game.fluid .card .cust .face{width:54px;height:58px}
#game.fluid .card .cname{font-size:16px}
#game.fluid .card .bubble{font-size:13px;padding:6px 10px;margin:6px 0;min-height:0}
#game.fluid .card .ord{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;font-size:13px;margin:4px 0 0}
#game.fluid .card .ord li{padding:3px 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#game.fluid .card .ord li span{font-size:11px}
#game.fluid .card .pat{margin-top:6px;font-size:12px}
/* 휴대폰 한 화면 배치: 머리말 한 줄 · 레시피 작은 표시줄(눌러서 손님 말 보기) · 촘촘한 도구 칸 */
#game.fluid #hdr{flex-wrap:nowrap;gap:6px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top,0px));align-items:center}
#game.fluid #hdr .logo>span:not(.logoFace){display:none}
#game.fluid .logoFace{width:32px;height:32px}
#game.fluid #steps{order:0;width:auto;flex:1 1 auto;min-width:0;gap:3px}
#game.fluid #steps span{font-size:11px;padding:3px 7px}
#game.fluid #hdr .coins{font-size:13px;padding:2px 8px;flex:none}
#game.fluid #hdr .snd{width:30px;height:30px;flex:none}
#game.fluid #hdr .home{font-size:0;padding:4px 6px;flex:none}
#game.fluid #hdr .home svg.ic{font-size:16px}
#game.fluid #side{margin:6px 8px 0}
#game.fluid .card::before{display:none}
#game.fluid .card{padding:6px 10px;border-radius:12px;cursor:pointer}
#game.fluid .card .cust{align-items:center;gap:8px}
#game.fluid .card .cust .face{width:38px;height:40px;animation:none}
#game.fluid .card .cname{font-size:14px;margin-left:0;text-align:left;line-height:1.2}
#game.fluid .card .cname br{display:none}
#game.fluid .card .cname span{margin-left:6px}
#game.fluid .card .cust::after{content:"눌러서 손님 말 보기 ▾";margin-left:auto;font-size:11px;color:#b98;white-space:nowrap}
#game.fluid #side.open .card .cust::after{content:"접기 ▴"}
#game.fluid .card .bubble{display:none}
#game.fluid #side.open .card .bubble{display:block}
#game.fluid .card .ord{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 0;font-size:12px}
#game.fluid .card .ord li{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border:1px solid #f1cfda;border-radius:10px;background:rgba(255,245,248,.85);max-width:100%}
#game.fluid .card .ord li b{font-size:10px;width:auto;color:#b98;font-weight:normal}
#game.fluid .card .ord li b:empty{display:none}
#game.fluid .card .ord li svg.ic{font-size:14px}
#game.fluid .card .ord li .ok,#game.fluid .card .ord li .no{font-size:11px;margin-left:2px}
#game.fluid .card .pat{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11px}
#game.fluid .card .pat .bar{flex:1;height:7px;margin:0}
#game.fluid #work{margin:6px 8px max(10px,env(safe-area-inset-bottom,0px))}
#game.fluid #bomi{width:44px;height:50px}
#game.fluid #tray{margin-top:6px;padding:8px;gap:6px}
#game.fluid .row{display:grid;grid-template-columns:26px repeat(auto-fill,minmax(36px,1fr));gap:3px;align-items:center}
#game.fluid .row .sep{display:none}
#game.fluid .row>b{width:26px;font-size:12px;overflow:hidden}
#game.fluid .row>b svg.ic{font-size:22px}
#game.fluid .tb.sm{width:auto;height:44px}
#game.fluid .tb small{font-size:9.5px;letter-spacing:-.5px}
#game.fluid .next{padding:9px;font-size:17px}
</style>

let AC = null;
function beep(f=660, d=.08, type='sine', v=.06, delay=0){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t+d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02);
  }catch(e){}
}

    // 아래 테두리에 짠 크림 (케이크 옆면 앞쪽)
    (c.dollops||[]).filter(d=>d.base && d.tier===i && d.v>-.05).sort((a,b)=>a.v-b.v).forEach(d => {
      const x=t.cx+d.u*t.R, y=t.bottom+d.v*t.R*K;
      out += d.shell ? shellSVG(x, y, d.s*sc, FROST[d.col].c, d.ang||0) : dollopSVG(x, y, d.s*sc, FROST[d.col].c, d.rot);
    });
    (c.sprinkles[i]||[]).forEach(s => {
      const x=t.cx+s.u*t.R, y=t.ty+s.v*t.R*K;
      out += `<rect x="${(x-3.5*sc).toFixed(1)}" y="${(y-1.2*sc).toFixed(1)}" width="${7*sc}" height="${2.4*sc}" rx="${1.2*sc}" fill="${s.col}" transform="rotate(${s.a} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
    });
    if (c.text && i===c.tiers-1){
      const surf = frosted && (c.frostFull || c.cover>.5) ? fr : sp;
      const col = lum(surf) < .5 ? '#fff6e8' : '#c2185b';
      const fs = Math.min(t.R*.42, t.R*1.7/Math.max(1,[...c.text].length));
      const dy = c.shape==='heart' ? -.12*t.R*K : 0;
      out += `<g transform="translate(${t.cx} ${t.ty+dy}) scale(1 ${K*1.6})"><text text-anchor="middle" dominant-baseline="central" font-size="${fs.toFixed(1)}" fill="${col}" font-family="Jua,'Malgun Gothic',sans-serif" stroke="${lum(surf)<.5?'none':'#fff'}" stroke-width="${fs*.06}" paint-order="stroke">${esc(c.text)}</text></g>`;
    }
    // 윗면의 짠 크림 + 토핑을 앞뒤 순서대로
    const pressed = new Set(c.decos.filter(d=>d.cream).map(d=>d.cream));   // 과일이 얹힌 크림은 눌린 모양
    const items = (c.dollops||[]).filter(d=>!d.base && d.tier===i).map(d=>({v:d.v-.001, svg:dollopSVG(t.cx+d.u*t.R, t.ty+d.v*t.R*K, d.s*sc, FROST[d.col].c, d.rot, d.id!=null && pressed.has(d.id))}));
    decoIdx.filter(o=>o.d.tier===i).forEach(({d,i:idx}) => {
      const x=t.cx+d.u*t.R, lift=(d.lift||0)*sc, y=t.ty+d.v*t.R*K-lift;   // lift: 크림 위에 얹으면 그만큼 위로
      const attr = pick ? ` data-i="${idx}" style="cursor:grab"` : '';
      const flat = FLAT_TOP[d.type];       // 자른 과일은 케이크 위에 눕혀서 (원근감으로 납작하게)
      const sz = (flat ? (d.lift ? 40 : 46) : (d.lift ? 36 : 42))*sc;   // 과일 크기
      const fruit = flat
        ? `<g transform="translate(${x.toFixed(1)} ${(y-sz*.1).toFixed(1)}) scale(1 .5)">${iconAt(d.type, 0, 0, sz, d.rot||0)}</g>
           <path d="M${(x-sz*.44).toFixed(1)} ${(y-sz*.1).toFixed(1)} Q${x} ${(y-sz*.1+sz*.3).toFixed(1)} ${(x+sz*.44).toFixed(1)} ${(y-sz*.1).toFixed(1)}" stroke="${FLAT_TOP[d.type]}" stroke-width="${(2.4*sc).toFixed(1)}" fill="none" opacity=".75"/>`
        : iconAt(d.type, x, y-sz*.37, sz, d.rot||0);
      items.push({v:d.v, svg: d.type==='candle' ? `<g${attr}>${candleSVG(x,y,sc,idx)}</g>`
        : `<g${attr}>${d.lift ? `<ellipse cx="${x}" cy="${y+1.5*sc}" rx="${(flat?16:10)*sc}" ry="${3*sc}" fill="rgba(60,20,20,.22)" filter="url(#fg-soft)"/>` : `<ellipse cx="${x+2*sc}" cy="${y+(flat?1:2)*sc}" rx="${(flat?20:15)*sc}" ry="${(flat?5:4.6)*sc}" fill="rgba(60,20,20,.24)" filter="url(#fg-soft)"/>`}${fruit}${d.lift && d.creamCol && !flat ? `<path d="M${(x-10*sc).toFixed(1)} ${(y-1.5*sc).toFixed(1)} Q${x} ${(y+4*sc).toFixed(1)} ${(x+10*sc).toFixed(1)} ${(y-1.5*sc).toFixed(1)} Q${x} ${(y+1.2*sc).toFixed(1)} ${(x-10*sc).toFixed(1)} ${(y-1.5*sc).toFixed(1)}Z" fill="${FROST[d.creamCol].c}" stroke="${shade(FROST[d.creamCol].c,-.15)}" stroke-width=".5"/>` : ''}</g>`});
    });
    items.sort((a,b)=>a.v-b.v).forEach(o => {
      out += o.svg;
    });
  });
  return `<defs>${[...defs.values()].join('')}</defs>` + out;
}

function hitTier(c,x,y){
  const g = geom(c);
  for (let i=g.length-1;i>=0;i--){
    const t=g[i], u=(x-t.cx)/t.R, v=(y-t.ty)/(t.R*K);
    if (!inShape(c.shape,u*1.1,v*1.1)) continue;
    if (i<g.length-1){
      const t2=g[i+1]; let hidden=false;
      for (let k=0;k<=4 && !hidden;k++){
        const yy = t2.bottom - t2.H*k/4;
        if (inShape(c.shape,(x-t2.cx)/t2.R,(y-yy)/(t2.R*K))) hidden=true;
      }
      if (hidden) continue;
    }
    return {tier:i,u,v};
  }
  return null;
}
function inSilhouette(c,g,x,y){
  for (const t of g) for (let k=0;k<=6;k++){
    const yy = t.bottom - (t.bottom-t.ty)*k/6;
    if (inShape(c.shape,(x-t.cx)/(t.R*1.035),(y-yy)/(t.R*K*1.035))) return true;
  }
  return false;
}
function overCake(c,x,y){
  const g=geom(c), b=g[0], topT=g[g.length-1];
  return Math.abs(x-b.cx) < b.R*1.1 && y > topT.ty - topT.R*K - 10 && y < b.bottom + b.R*K + 10;
}

/* ---------- 케이크 틀 ---------- */
function panLayout(c){
  const n=c.tiers, s=[1,.72,.56][n-1], gap=30*s;
  const Rs=[...Array(n)].map((_,i)=>TR[i]*s*1.06);
  const total=Rs.reduce((a,r)=>a+2*r,0)+gap*(n-1);
  let x=300-total/2;
  return Rs.map((Ro,i)=>{ const cx=x+Ro; x+=2*Ro+gap; return {i,cx,R:TR[i]*s,s,H:TH[i]*s/.8,bottom:PAN_Y}; });
}
const FILL_LO = .65, FILL_HI = .88, FILL_GOAL = .78;   // 알맞은 반죽 양 (틀 높이에 대한 비율)
function pourQuality(f){ if (f>=FILL_LO && f<=FILL_HI) return 1; const d=f<FILL_LO?FILL_LO-f:f-FILL_HI; return Math.max(0,1-d/.3); }
function pourLabel(f){ return f<.45?'반죽이 너무 적어요':f<FILL_LO?'조금 적어요':f<=FILL_HI?'딱 알맞아요!':f<=1?'조금 많아요':'넘쳐 버렸어요!'; }
/* 틀 테두리: 양옆 세로선 + 바닥 앞쪽 곡선 (뒤쪽 바닥은 가려지니 그리지 않아요) */
function panEdges(p, rim, tf, D, P, i, bottom = p.bottom){
  const pts = samplePts(G.cake.shape, 90), xs = pts.map(q => q[0]), R = p.R*1.06, W = 3;
  const xl = p.cx + Math.min(...xs)*R, xr = p.cx + Math.max(...xs)*R;
  return `<clipPath id="${P}bf${i}"><rect x="${p.cx-p.R*2}" y="${bottom}" width="${p.R*4}" height="${p.R*2}"/></clipPath>
    <path d="${D}" transform="${tf(bottom,1.06)}" fill="none" stroke="#4a5360" stroke-width="${W}" vector-effect="non-scaling-stroke" clip-path="url(#${P}bf${i})"/>
    <path d="M${xl.toFixed(1)} ${rim.toFixed(1)} V${bottom.toFixed(1)} M${xr.toFixed(1)} ${rim.toFixed(1)} V${bottom.toFixed(1)}" stroke="#4a5360" stroke-width="${W}" stroke-linecap="round"/>
    <path d="${D}" transform="${tf(rim,1.06)}" fill="none" stroke="#4a5360" stroke-width="${W}" vector-effect="non-scaling-stroke"/>`;
}
function pansSVG(c, mode, bakeP=0){
  const P='p'+(++cakeSeq)+'_', defs=new Map(), D=SHAPES[c.shape], RING=D+scalePath(D,.925);
  defs.set('m',`<linearGradient id="${P}metal" x1="0" x2="1"><stop offset="0" stop-color="#8f99a6"/><stop offset=".35" stop-color="#eef2f7"/><stop offset=".6" stop-color="#c3cbd5"/><stop offset="1" stop-color="#7f8996"/></linearGradient>`);
  const L=panLayout(c), bat=batterColor(c);
  let out='';
  L.forEach((p,i) => {
    const st=G.pans[i];
    const tf=(y,s)=>`translate(${p.cx.toFixed(1)} ${y.toFixed(1)}) scale(${(p.R*s).toFixed(2)} ${(p.R*K*s).toFixed(2)})`;
    const ring=y=>`<path d="${RING}" fill-rule="evenodd" transform="${tf(y,1.06)}" fill="url(#${P}metal)"/>`;
    const step=Math.max(1.2,1.5*p.s);
    if (mode==='unmold'){
      const cakeTop = p.bottom - TH[i]*p.s;
      out += `<ellipse cx="${p.cx}" cy="${p.bottom+4}" rx="${p.R*1.1}" ry="${p.R*K*1.1}" fill="rgba(80,40,60,.13)"/>`;
      out += renderCake(c,{cx:p.cx,baseY:p.bottom,sc:p.s,plate:false,only:i});
      if (st.removed) return;
      const lift=st.lift, bot=p.bottom-lift, rim=p.bottom-p.H-lift;
      let below='', above='';
      for (let y=bot; y>=rim; y-=step) (y>cakeTop ? (below+=ring(y)) : (above+=ring(y)));
      defs.set('k'+i,`<mask id="${P}k${i}" maskUnits="userSpaceOnUse" x="-100" y="-100" width="800" height="600"><rect x="-100" y="-100" width="800" height="600" fill="#fff"/><path d="${D}" transform="${tf(cakeTop,.98)}" fill="#000"/></mask>`);
      out += `<g mask="url(#${P}k${i})">${below}</g>${above}`;
      out += `<path d="${RING}" fill-rule="evenodd" transform="${tf(rim,1.06)}" fill="#f4f7fb" stroke="#56606d" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
      out += panEdges(p, rim, tf, D, P, i, bot);
      return;
    }
    let f = st.fill;
    // 오븐: 반죽이 부풀어 오르며 가운데가 봉긋해지고, 겉면이 노릇노릇 → 타면 새까맣게
    const rise = mode==='oven' ? ease(Math.min(1, bakeP*1.45)) : 0;
    if (mode==='oven') f = Math.min(1.04, f + (Math.max(.9,f+.2)-f)*rise);
    const level = p.bottom - Math.min(f,1)*p.H, rim = p.bottom-p.H;
    let surf = bat;
    if (mode==='oven'){
      const sp = spongeColor(Object.assign({},c,{bake:bakeP}));
      surf = bakeP<.72 ? mixHex(sp, lum(sp)>.45 ? '#b8692c' : '#3a2010', .4*ease(bakeP/.72)) : sp;  // 겉면 갈색 크러스트
    }
    if (f>1 && mode!=='oven') out += `<ellipse cx="${p.cx+p.R*.2}" cy="${p.bottom+p.R*K*.95}" rx="${p.R*.9*Math.min(1,(f-1)*8)}" ry="${p.R*K*.35*Math.min(1,(f-1)*8)}" fill="${bat}"/>`;
    out += `<ellipse cx="${p.cx}" cy="${p.bottom+4}" rx="${p.R*1.1}" ry="${p.R*K*1.1}" fill="rgba(80,40,60,.15)"/>`;
    out += `<path d="${D}" transform="${tf(p.bottom,1)}" fill="#8e98a5"/>`;
    let below='', above='';
    for (let y=p.bottom; y>=rim; y-=step) (y>level ? (below+=ring(y)) : (above+=ring(y)));
    out += below;

    if (f>0){
      out += `<path d="${D}" transform="${tf(level,.98)}" fill="${surf}"/>`;
      if (mode==='oven'){
        // 봉긋하게 부푼 윗면 (층층이 쌓아 돔 모양)
        const domeH = 36*p.s*rise, N=10;
        for (let q=1;q<=N;q++){ const z=q/N; out += `<path d="${D}" transform="${tf(level-domeH*z,.98*Math.sqrt(1-z*z*.82))}" fill="${shade(surf, -.2 + z*.26)}" stroke="${shade(surf,-.3)}" stroke-width=".6" vector-effect="non-scaling-stroke" stroke-opacity=".35"/>`; }
        if (bakeP>.82){ // 타서 갈라진 틈
          const top = level - domeH*.6, w = p.R*.5;
          out += `<path d="M${p.cx-w} ${top} l${w*.35} ${-4*p.s} l${w*.3} ${6*p.s} l${w*.4} ${-5*p.s} l${w*.45} ${4*p.s} l${w*.5} ${-3*p.s}" stroke="#000" stroke-width="${2.2*p.s}" fill="none" opacity="${Math.min(.8,(bakeP-.82)*5)}"/>`;
        } else out += `<ellipse cx="${p.cx-p.R*.2}" cy="${level-domeH*.75}" rx="${p.R*.25}" ry="${p.R*K*.12}" fill="#fff" opacity="${(.25*(1-rise*.5)).toFixed(2)}"/>`;
        if (bakeP < .5){ // 익기 시작하면 반죽 윗면에 작은 기포가 보글보글 올라왔다 터져요
          const R = seeded(37+i*11), tm = performance.now()/1000, fadeB = 1 - bakeP/.5;
          for (let k=0;k<7;k++){ const bx = p.cx + (R()*2-1)*p.R*.42, by = level - domeH*.86 + (R()*2-1)*p.R*K*.22, ph = (tm*.9 + R()) % 1;
            out += `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${((1.2+3.2*ph)*Math.max(.8,p.s)).toFixed(2)}" fill="none" stroke="${shade(surf,.35)}" stroke-width="1.2" opacity="${((1-ph)*.8*fadeB).toFixed(2)}"/>`; }
        }
      } else out += `<path d="${D}" transform="${tf(level-1,.6)}" fill="${shade(surf,.18)}" opacity=".5"/>`;
    }
    out += above;
    out += `<path d="${RING}" fill-rule="evenodd" transform="${tf(rim,1.06)}" fill="#f4f7fb" stroke="#56606d" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
    out += panEdges(p, rim, tf, D, P, i);
    if (mode==='pour'){
      const gy = p.bottom - FILL_GOAL*p.H, ok = f >= FILL_LO && f <= FILL_HI;
      out += `<path d="${D}" transform="${tf(gy,.985)}" fill="none" stroke="#fff" stroke-width="4.5" stroke-dasharray="7 5" vector-effect="non-scaling-stroke" opacity=".8"/>
        <path d="${D}" transform="${tf(gy,.985)}" fill="none" stroke="${ok ? '#2fb36a' : '#ff4f86'}" stroke-width="2.4" stroke-dasharray="7 5" vector-effect="non-scaling-stroke"/>
        <g transform="translate(${(p.cx - 23*Math.max(.7,p.s)).toFixed(1)} ${(gy + p.R*K*.985).toFixed(1)})"><rect x="0" y="-9" width="${(46*Math.max(.7,p.s)).toFixed(1)}" height="18" rx="9" fill="${ok ? '#2fb36a' : '#ff4f86'}" stroke="#fff" stroke-width="1.5"/>
          <text x="${(23*Math.max(.7,p.s)).toFixed(1)}" y="4.5" text-anchor="middle" font-size="${(11*Math.max(.75,p.s)).toFixed(1)}" fill="#fff" font-family="Jua,sans-serif">${ok ? '딱 좋아요' : '여기까지'}</text></g>`;
    }
    if (f>1 && mode!=='oven'){
      const fx=p.cx+p.R*.2, fy=rim+p.R*K*1.02;
      out += `<path d="M${fx-10*p.s} ${fy} q2 ${30*p.s} ${10*p.s} ${p.H*.9} q8 ${-10*p.s} ${10*p.s} ${-p.H*.9}Z" fill="${bat}"/>`;
    }
  });
  return `<defs>${[...defs.values()].join('')}</defs>` + out;
}
function panAt(x,y){
  const L=panLayout(G.cake);
  for (const p of L){ const st=G.pans[p.i]; if (st.removed) continue;
    const rim=p.bottom-p.H-st.lift;
    if (Math.abs(x-p.cx)<p.R*1.15 && y>rim-p.R*K*1.2 && y<p.bottom-st.lift+p.R*K*1.2) return p; }
  return null;
}

/* =====================================================================
   반짝이 효과 (캔버스): 잘했을 때 터지는 별 + 타이틀에 떠다니는 빛 방울

const FX = {
  cv:null, ctx:null, parts:[], running:false, ambient:false, last:0,
  init(){ this.cv=$('#fxCanvas'); this.ctx=this.cv.getContext('2d'); },
  local(cx,cy){ const r=this.cv.getBoundingClientRect(); return [(cx-r.left)*(this.cv.clientWidth/Math.max(1,r.width)), (cy-r.top)*(this.cv.clientHeight/Math.max(1,r.height))]; },
  burstAt(el,n=24){ if (!this.cv) return; const r=el.getBoundingClientRect(); const [x,y]=this.local(r.left+r.width/2, r.top+r.height*.5); this.burst(x,y,n); },
  burst(x,y,n=24){
    const cols=['#ffd23f','#ffffff','#ff8fb1','#9fe3ff','#c9a2ff'];
    for (let i=0;i<n;i++){ const a=rnd(0,Math.PI*2), v=rnd(90,300);
      this.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:rnd(.6,1.15),age:0,size:rnd(4,10),kind:i%3?'star':'dot',col:pick(cols),rot:rnd(0,6)}); }
    this.run();
  },
  run(){ if (this.running || !this.cv) return; this.running=true; this.last=performance.now(); requestAnimationFrame(t=>this.frame(t)); },
  star(c,x,y,s,rot){ c.save(); c.translate(x,y); c.rotate(rot); c.beginPath();
    for (let i=0;i<8;i++){ const r=i%2?s*.32:s; const a=i*Math.PI/4; c.lineTo(Math.cos(a)*r,Math.sin(a)*r); } c.closePath(); c.fill(); c.restore(); },
  frame(t){
    const dt=Math.min(.05,(t-this.last)/1000); this.last=t;
    const cv=this.cv, c=this.ctx, W=cv.clientWidth, H=cv.clientHeight, dpr=Math.min(2,window.devicePixelRatio||1);
    const pw=Math.round(W*dpr*(SCALE||1)), ph=Math.round(H*dpr*(SCALE||1));
    if (cv.width!==pw || cv.height!==ph){ cv.width=pw; cv.height=ph; }
    c.setTransform(pw/Math.max(1,W),0,0,ph/Math.max(1,H),0,0); c.clearRect(0,0,W,H);
    const titleOn = this.ambient && $('#title').classList.contains('on');
    if (titleOn && Math.random() < dt*7) this.parts.push({x:rnd(0,W),y:H+12,vx:rnd(-12,12),vy:rnd(-24,-55),life:rnd(5,9),age:0,size:rnd(4,14),kind:'bokeh',col:pick(['#fff6c8','#ffd0de','#ffffff','#ffe7a6'])});
    this.parts = this.parts.filter(p => (p.age+=dt) < p.life);
    for (const p of this.parts){
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      if (p.kind!=='bokeh'){ p.vy+=260*dt; p.vx*=.985; p.rot+=dt*4; }
      const k=p.age/p.life;
      if (p.kind==='bokeh'){ c.globalAlpha=Math.sin(Math.PI*k)*.55; c.fillStyle=p.col; c.beginPath(); c.arc(p.x,p.y,p.size,0,7); c.fill();
        c.globalAlpha*=.35; c.beginPath(); c.arc(p.x,p.y,p.size*2.1,0,7); c.fill(); }
      else { c.globalAlpha=1-k; c.fillStyle=p.col; if (p.kind==='star') this.star(c,p.x,p.y,p.size*(1-k*.4),p.rot); else { c.beginPath(); c.arc(p.x,p.y,p.size*.45,0,7); c.fill(); } }
    }
    c.globalAlpha=1;
    if (this.parts.length || titleOn) requestAnimationFrame(tt=>this.frame(tt));
    else { this.running=false; c.clearRect(0,0,W,H); }
  }
};

/* =====================================================================
   배경 음악: 오르골 느낌의 짧은 곡을 반복 (C-Am-F-G)
   ===================================================================== */
const BGM = (() => {
  const mtof = m => 440*Math.pow(2,(m-69)/12);
  const CH = [[60,64,67],[57,60,64],[53,57,60],[55,59,62]];
  const MEL = [76,null,79,76, 74,null,72,null, 72,null,76,72, 69,null,null,null, 69,null,72,74, 77,null,76,74, 74,null,79,77, 76,null,74,null];
  let playing=false, timer=0, step=0, next=0, master=null;
  const tone = (f,t,d,type,v) => { const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(master); o.start(t); o.stop(t+d+.05); };
  const tick = () => { const half=60/100/2;
    while (next < AC.currentTime+.3){
      const ch=CH[Math.floor(step/8)%4], k=step%8;
      tone(mtof(ch[[0,1,2,1,0,1,2,1][k]] + (k>=4?0:-12)), next, .55, 'triangle', .04);
      if (k===0) tone(mtof(ch[0]-24), next, 1.7, 'sine', .06);
      const m=MEL[step%32]; if (m){ tone(mtof(m), next, .5, 'sine', .045); tone(mtof(m+12), next, .22, 'triangle', .012); }
      next += half; step++;
    } };
  return {
    get on(){ return save.music !== false; },
    start(){ if (!this.on || playing) return;
      try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if (AC.state==='suspended') AC.resume();
        if (!master){ master=AC.createGain(); master.gain.value=.6; master.connect(AC.destination); } }catch(e){ return; }
      playing=true; next=AC.currentTime+.1; timer=setInterval(tick,80); },
    stop(){ playing=false; clearInterval(timer); },
    toggle(){ save.music = !this.on; persist(); this.on ? this.start() : this.stop(); musicButtons(); }
  };
})();
function musicButtons(){ ['#bMusic','#tMusic'].forEach(s => { const b=$(s); if (b){ b.innerHTML=icon(BGM.on?'music':'mute'); b.setAttribute('aria-pressed', BGM.on); b.title = BGM.on ? '배경 음악 끄기' : '배경 음악 켜기'; } }); }

/* ---------- 유리 볼 속 내용물 ----------
   재료를 넣을수록 내용물 높이가 올라가고, 볼 모양(아래로 갈수록 좁아짐)에 맞춰 표면이 넓어져요.
   유리 볼이라 옆면으로도 담긴 재료가 비쳐 보여요. */
const ANIM_MS = 2600;
const ITEM_VOL = {powder:1, liquid:1.5, egg:.9, drop:.6, drops:.15, fruit:.8};
function overBowl(p){ return ((p.x-300)/180)**2 + ((p.y-200)/110)**2 <= 1.2; }
function bowlHalf(y){  // 볼 안쪽 곡선(194→354)에서 높이 y의 반지름
  let best=0, bd=1e9;
  for (let i=0;i<=60;i++){ const t=i/60, yy=(1-t)**2*194+2*t*(1-t)*352+t*t*354, d=Math.abs(yy-y);
    if (d<bd){ bd=d; best=300-((1-t)**2*138+2*t*(1-t)*146+t*t*300); } }
  return best;
}
function bowlLevel(vol){ const sy=Math.max(236, 350-vol*15), rx=Math.max(18, bowlHalf(sy)*.97); return {sy, rx, ry:rx*.27}; }
const bowlVol = items => items.reduce((a,b)=>a+(b.flavor ? 0 : (ITEM_VOL[b.kind]||1)),0);
function itemCol(b){ return b.kind==='egg' ? '#ffe39a' : b.kind==='drop' ? '#ffe27a' : b.col; }
function contentsCol(list){
  let w=0,r=0,g=0,bl=0;
  list.forEach(([b,v]) => { const [R,G2,B]=hexRGB(itemCol(b)); r+=R*v; g+=G2*v; bl+=B*v; w+=v; });
  return w ? mixHex(rgbHex(r/w,g/w,bl/w),'#efe4cf',.18) : '#efe4cf';
}
function seeded(seed){ let s=(seed|0)||7; return () => { s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
/* 가루 산: 봉긋한 봉우리 + 오른쪽 그늘 + 왼쪽 빛 + 알갱이 + 바닥에 퍼진 가루 */
function moundSVG(x,y,w,h,col,seed,sparkle){
  const dk=shade(col, lum(col)>.9 ? -.22 : -.2), lt=shade(col,.5), R=seeded(seed);
  let s = `<ellipse cx="${x.toFixed(1)}" cy="${(y+1).toFixed(1)}" rx="${(w*1.3).toFixed(1)}" ry="${(w*.3).toFixed(1)}" fill="${col}" opacity=".8"/>`;
  if (h < 2) return s;
  s += `<path d="M${x-w} ${y} Q${x-w*.55} ${y-h*.35} ${x-w*.22} ${y-h*.88} Q${x} ${y-h*1.08} ${x+w*.2} ${y-h*.9} Q${x+w*.55} ${y-h*.35} ${x+w} ${y} Q${x} ${y+w*.26} ${x-w} ${y}Z" fill="${col}" stroke="${dk}" stroke-width=".7"/>`;
  s += `<path d="M${x+w*.06} ${y-h*1.02} Q${x+w*.55} ${y-h*.35} ${x+w} ${y} Q${x+w*.5} ${y+w*.17} ${x+w*.12} ${y+w*.22} Q${x+w*.3} ${y-h*.45} ${x+w*.06} ${y-h*1.02}Z" fill="${dk}" opacity=".32"/>`;
  s += `<path d="M${x-w*.72} ${y-h*.1} Q${x-w*.45} ${y-h*.55} ${x-w*.14} ${y-h*.9}" stroke="${lt}" stroke-width="${Math.max(1.5,w*.12).toFixed(1)}" fill="none" stroke-linecap="round" opacity=".9"/>`;
  for (let i=0;i<26;i++){ const u=R()*2-1, v=R(), gx=x+u*w*(1-v*.8)*.9, gy=y-v*h*.95+R()*3;
    s += `<circle cx="${gx.toFixed(1)}" cy="${gy.toFixed(1)}" r="${(.45+R()*.8).toFixed(2)}" fill="${R()<.55?dk:lt}" opacity=".75"/>`; }
  if (sparkle) for (let i=0;i<8;i++){ const u=R()*2-1, v=R(), gx=x+u*w*(1-v*.8)*.85, gy=y-v*h*.9;
    s += `<rect x="${(gx-1.3).toFixed(1)}" y="${(gy-1.3).toFixed(1)}" width="2.6" height="2.6" fill="#fff" stroke="#b9d0f5" stroke-width=".6" transform="rotate(45 ${gx.toFixed(1)} ${gy.toFixed(1)})"/>`; }
  return s;
}
/* 볼에 담긴 재료 하나 (L: 현재 높이, grow: 붓는 중 0→1, fade/flat: 섞으면 흐려지고 납작해져요) */
const FRUIT_SPOTS = [[-26,-3,-18],[2,6,12],[28,-2,-8]];   // 과일 3개가 놓이는 자리 [가로, 세로, 기울기]
function blobSVG(b,L,grow=1,fade=1,flat=1){
  if (fade<=0.01 || grow<=0.01) return '';
  const k=clamp(L.rx/150,.5,1), x=300+b.u*L.rx, y=L.sy+b.v*L.ry, km=clamp(L.rx/150,.8,1.05);
  let s='';
  switch (b.kind){
    case 'powder': s = moundSVG(x, y, 44*km*Math.sqrt(grow), 40*km*grow*flat, b.col, b.seed, b.sparkle); break;
    case 'liquid': s = `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(k*grow).toFixed(2)})"><ellipse rx="38" ry="9.5" fill="${b.col}" opacity=".92"/><path d="M-24 -2 Q0 -7 26 -1" stroke="#fff" stroke-width="1.6" fill="none" opacity=".65"/></g>`; break;
    case 'egg': s = `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(k*2.25).toFixed(2)})"><path d="M-22 1 Q-26 -7 -12 -9 Q-2 -14 10 -9 Q24 -8 21 1 Q22 8 6 8 Q-12 10 -22 1Z" fill="#fffbf0" opacity=".92" stroke="#efe6cf" stroke-width=".6"/>
        <ellipse cx="1" cy="-3" rx="9" ry="7" fill="#ffbb1c"/><ellipse cx="1" cy="-1" rx="9" ry="5" fill="#f2a510" opacity=".35"/><ellipse cx="-2" cy="-6" rx="3.4" ry="2" fill="#fff5c4"/></g>`; break;
    case 'drop': s = `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(k*1.8).toFixed(2)})"><ellipse cx="2" cy="4" rx="17" ry="4.5" fill="#fff0a0" opacity=".8"/>
        <path d="M-12 -4 l7 -6 h18 l-7 6z" fill="#fff4b0"/><rect x="-12" y="-4" width="18" height="11" fill="#ffe27a"/><path d="M6 -4 l7 -6 v11 l-7 6z" fill="#efc955"/><path d="M-10 -2 h10" stroke="#fff" stroke-width="1.5" opacity=".7"/></g>`; break;

/* ---------- 흐르는 액체 그리기 ----------

        else { const k2 = (py-by)/160; if (k2<1){ back += `<ellipse cx="${bx}" cy="${by}" rx="${4+k2*22}" ry="${(4+k2*22)*.28}" fill="none" stroke="${it.col}" stroke-width="${2*(1-k2)}" opacity="${1-k2}"/>`;
          [-1,1].forEach(dir=>{ back += `<circle cx="${bx+dir*k2*14}" cy="${by-Math.sin(k2*Math.PI)*12}" r="${1.8*(1-k2)+.5}" fill="${it.col}"/>`; }); } }

  } else if (it.kind==='drop'){
    const fall = clamp((t-.3)/.17,0,1), x=lerp(lerp(470,bx+20,inT),bx,fall), y=t<.3?lerp(20,60,inT):lerp(60,by-6,fall*fall);

  } else if (it.kind==='fruit'){
    // 하나씩 떨어져(중력 가속) 빙글 돌다가, 반죽에 닿으면 통통 튀고 출렁이며 자리를 잡아요

/* 재료마다 따로 시간이 흘러요: 하나가 끝나면 그것만 그릇에 담기고, 나머지는 계속 들어가요 */
function animFrame(now){
  if (!G){ return; }
  if (G.step!==0 || !G.anims){ G.anims=[]; G.animLoop=false; $('#anim').innerHTML=''; return; }
  const c=G.cake, done=[];
  G.anims.forEach(a => {
    const t=(now-a.t0)/ANIM_MS;
    if (t>=1){ done.push(a); return; }
    a.t = t; a.prog = pourProg(a.item,t);
  });
  done.forEach(a => {
    G.anims.splice(G.anims.indexOf(a),1);
    if (a.isFlavor){ c.flavors = [...flavList(c), a.id]; c.flavor = c.flavors[0]; } else { c.ing[a.id]=(c.ing[a.id]||0)+1; if (c.ing[a.id]>1) toast(`${a.item.label}을(를) 또 넣었어요!`); }
    G.bowl.push(a.blob);

  let front = '';
  G.anims.forEach(a => { const r = animSVG(a,a.t); a.back = r.back; front += r.front; });
  // 담길 때: 그릇·재료 칸만 바로 고치고, 손님 카드는 모든 재료가 다 들어간 뒤 한 번만 (끊김 방지)
  if (done.length){ viewMix(); renderTray(); if (!G.anims.length) renderCard(); } else viewMix();
  $('#anim').innerHTML = front;

}
function mixDown(e){
  const p=svgPt(e), c=G.cake;

  if (!Object.keys(c.ing).length || !c.flavor){ toast('재료와 맛을 먼저 넣어주세요!'); sfx.bad(); return; }

/* 손가락 움직임(1초에 120번까지)마다 그리지 않고, 화면 한 프레임에 한 번만 그려요 */
function drawMixFrame(whisk, bowl){
  G.mixFx = whisk; G.mixBowl = G.mixBowl || bowl;
  if (G.mixRAF) return;
  G.mixRAF = requestAnimationFrame(() => {
    if (!G) return; G.mixRAF = 0;
    if (G.step !== 0) return;

  });
}
function mixMove(e){
  const p=svgPt(e), c=G.cake;
  const over = ((p.x-300)/175)**2 + ((p.y-210)/70)**2 <= 1.3;
  // 거품기: 손잡이는 위, 철사 헤드는 아래(반죽 속)로. 움직이는 방향으로 살짝 기울어요.
  const vx = G.wPrev ? p.x-G.wPrev.x : 0; G.wPrev = p;
  G.wAng = lerp(G.wAng||0, clamp(vx*2.2,-28,28), .35);
  const a = G.wAng*Math.PI/180, S = 74, off = S*.44;
  let whisk = '';
  if ((over||G.mixing) && !pouring().length){
    whisk = iconAt('whisk', p.x + Math.sin(a)*off, p.y - Math.cos(a)*off, S, 180+G.wAng);
    if (G.mixing && c.mix<1){ // 반죽에 잠긴 헤드 끝과 물결
      const bc = mixHex('#efe4cf', batterColor(c), Math.min(1,c.mix*1.3));
      whisk += `<ellipse cx="${p.x}" cy="${p.y-2}" rx="16" ry="5" fill="${bc}" opacity=".95"/>
        <ellipse cx="${p.x}" cy="${p.y-2}" rx="${20+Math.sin(G.swirl/8)*4}" ry="6.5" fill="none" stroke="${shade(bc,-.15)}" stroke-width="1.5" opacity=".6"/>`;
    }
  }
  if (!G.mixing){ drawMixFrame(whisk, false); return; }
  const d = Math.hypot(p.x-G.last.x, p.y-G.last.y);
  // 그릇 가운데를 기준으로 손가락이 돈 각도만큼 소용돌이도 같은 방향으로 돌아요 (반죽 표면이 납작한 타원이라 세로를 펴서 계산)

/* ================= 2. 틀에 붓기 ================= */
function curPan(){ return G.pans.findIndex(p=>!p.done); }

      <rect x="-120" y="${ys.toFixed(1)}" width="240" height="140" fill="${shade(bat,-.08)}"/>
      <ellipse cx="0" cy="${ys.toFixed(1)}" rx="${(w*1.04).toFixed(1)}" ry="${(w*.3).toFixed(1)}" fill="${bat}"/>
      <ellipse cx="${(-w*.25).toFixed(1)}" cy="${(ys-w*.06).toFixed(1)}" rx="${(w*.45).toFixed(1)}" ry="${(w*.1).toFixed(1)}" fill="#fff" opacity=".35"/>
    </g></g>` : ''}
    <path d="M-58 0 Q-52 52 0 54 Q52 52 58 0" fill="#eef6ff" fill-opacity=".28" stroke="#a9c1dc" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="58" ry="17" fill="none" stroke="#a9c1dc" stroke-width="2.4"/>
    <path d="M-58 0 A58 17 0 0 0 58 0" fill="none" stroke="#f4f9ff" stroke-width="2" opacity=".9"/>
    <path d="M-42 14 Q-36 40 -10 46" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".6"/></g>`;
}
function viewPour(){
  const c=G.cake, L=panLayout(c);

  const used = G.pans.reduce((a,p)=>a+Math.min(p.fill,1.1),0), amount = Math.max(0, 1-used/(c.tiers*1.05));
  const F = G.flow, fp = F.head>0 ? F.pan : cur;
  if (fp>=0){
    const p=L[fp], st=G.pans[fp], bat=batterColor(c), time=performance.now()/1000;
    const bx = Math.min(520, p.cx + p.R*.6 + 50), by = 92;
    const lip = rot(-58,0,G.tilt), lx=bx+lip[0], ly=by+lip[1];

      if (F.head>=1 && F.tail<1){ // 떨어진 반죽이 겹겹이 쌓이는 모양
        for (let k=0;k<4;k++) s += `<ellipse cx="${(p.cx+Math.sin(time*4+k*1.7)*5*p.s).toFixed(1)}" cy="${ty-k*2.2}" rx="${(15-k*3)*Math.max(.7,p.s)}" ry="${(4.5-k*.8)*Math.max(.7,p.s)}" fill="${shade(bat,k%2?.08:-.03)}" stroke="${shade(bat,-.14)}" stroke-width=".7"/>`;

  } else {
    s += bowlTilted(520,92,-12,c,amount);

function pourFrame(now){

  } else if (F.head>0){

function pourDown(e){ const p=svgPt(e); if (p.y>40) { $('#view').setPointerCapture(e.pointerId); startPour(); } }

  }
  if (G.phase==='unmold'){
    layer(pansSVG(c,'unmold'));
    const left = G.pans.filter(p=>!p.removed).length;
    setHint(left ? `오븐 장갑으로 틀을 꾹 잡고 위로 쭉 끌어올려요! (남은 틀 ${left}개)` : (c.tiers>1?'케이크를 차곡차곡 쌓아요!':'케이크를 접시에 옮겨요!'));
    setMeter('굽기 상태', bakeQuality(c.bake));
    return;
  }
  layer(use3D() ? '' : renderCake(c));
  setHint(bakeLabel(c.bake) + ' · 크림을 바르러 가요 ▶' + (use3D() ? ' (빈 곳을 끌면 케이크가 돌아가요)' : ''));
  setMeter('굽기 상태', bakeQuality(c.bake));
}
function trayBake(){
  const c=G.cake;

    <button class="next fire" id="takeOut">꺼내기!</button>`;
  if (G.phase==='ready') return `<div class="msg">틀 ${c.tiers}개에 반죽을 담았어요.<br>오븐에 넣고 알맞게 구워 볼까요?</div><button class="next fire" id="bake">${icon('fire')} 오븐에 넣기</button>`;

      <button class="next" id="stack" ${left?'disabled':''}>${icon(c.tiers>1?'cake':'plate')} ${c.tiers>1?'차곡차곡 쌓기':'접시에 올리기'}</button>`;
  }
  return `<div class="msg">${bakeLabel(c.bake)}</div><button class="next" id="next">다음 ▶</button>`;
}
function bindBake(){
  if ($('#takeOut')) $('#takeOut').onclick = stopBake;
  if ($('#bake')) $('#bake').onclick = startBake;
  if ($('#stack')) $('#stack').onclick = () => { G.phase='stacked'; [0,1,2].forEach(i=>beep(500+i*200,.08,'triangle',.05,i*.1)); toast(G.cake.tiers>1?'케이크를 쌓았어요!':'접시에 올렸어요!'); renderView(); renderTray(); };
  if ($('#next')) $('#next').onclick = goNext;
}
function startBake(){
  G.phase='baking'; G.baking = {p:0, t:performance.now(), lastTick:0, ins:0};
  renderView(); renderTray();
  beep(180,.4,'sawtooth',.03);
  requestAnimationFrame(bakeFrame);
}
function bakeFrame(now){
  if (!G || G.phase!=='baking' || !G.baking) return;
  const b = G.baking, dt = Math.min(50, now-b.t); b.t = now;
  if (b.out != null){   // 꺼내는 중: 틀이 앞으로 쑥 밀려 나와요
    b.out = Math.min(1, b.out + dt/450); ovenSlide(1-b.out, now);
    if (b.out >= 1){ G.baking = null; G.phase='unmold'; renderView(); renderTray(); }
    else requestAnimationFrame(bakeFrame);
    return;
  }
  if (b.ins < 1){ b.ins = Math.min(1, b.ins + dt/650); ovenSlide(b.ins, now); requestAnimationFrame(bakeFrame); return; }   // 넣는 중
  b.p += dt/BAKE_MS;
  if (b.p >= 1){ b.p = 1; stopBake(); requestAnimationFrame(bakeFrame); return; }
  ovenHeat(b.p, now);
  const n=$('#needle'); if (n) n.style.left = (b.p*100)+'%';
  const op=$('#ovenPans'); if (op) op.innerHTML = pansSVG(G.cake,'oven',b.p);
  const sm=$('#smoke'); if (sm){ sm.setAttribute('opacity', b.p>.76 ? Math.min(1,(b.p-.76)*4) : 0); sm.setAttribute('transform', `translate(0 ${(-((now/30)%20)).toFixed(1)})`); }
  const tm=$('#ovenTime'); if (tm) tm.textContent = String(Math.floor(b.p*60)).padStart(2,'0')+'분';
  if (b.p - b.lastTick > .05){ b.lastTick=b.p; sfx.tick(); }
  requestAnimationFrame(bakeFrame);
}
function stopBake(){
  if (G.phase!=='baking' || !G.baking || G.baking.out != null || G.baking.ins < 1) return;
  G.cake.bake = G.baking.p; G.baking.out = 0;
  bakeQuality(G.cake.bake)>=1 ? sfx.ok() : sfx.bad();
  toast(bakeLabel(G.cake.bake)); sfx.swoosh();
  const t = $('#takeOut'); if (t) t.disabled = true;   // 굽는 루프가 그대로 이어서 꺼내는 모습을 그려요
}
/* 오븐 속 틀 위치: 0이면 오븐 앞 아래, 1이면 오븐 선반 위 */
function ovenSlide(k, now){
  const op = $('#ovenPans'); if (!op) return;
  const e = ease(k), y = 276 + (1-e)*150, sc = .54 + (1-e)*.22;
  op.setAttribute('transform', `translate(300 ${y.toFixed(1)}) scale(${sc.toFixed(3)}) translate(-300 -${PAN_Y})`);
  ovenHeat(G.baking ? G.baking.p : 0, now, k);
}
/* 열선이 점점 빨갛게 달아오르고, 아지랑이가 일렁여요 */
function ovenHeat(p, now, k=1){
  const heat = Math.min(1, p*3) * k;
  const coil = $('#ovenCoil'); if (coil) coil.setAttribute('stroke', mixHex('#8a4a3a', '#ff5a1f', heat*(.85+.15*Math.sin(now/180))));
  const hw = $('#heatWave'); if (hw){ hw.setAttribute('opacity', (heat*.18).toFixed(3)); hw.setAttribute('transform', `translate(${(Math.sin(now/260)*4).toFixed(1)} ${(-((now/40)%40)).toFixed(1)})`); }
}
function unmoldDown(e){
  if (G.phase!=='unmold') return;
  const p=svgPt(e), pan=panAt(p.x,p.y); if (!pan) return;
  G.unm = {i:pan.i, y0:p.y}; $('#view').setPointerCapture(e.pointerId);
}
function unmoldMove(e){
  if (G.phase!=='unmold') return;
  const p=svgPt(e);
  const hand = (G.unm || panAt(p.x,p.y)) ? iconAt(G.unm?'mittGrab':'mitt', p.x, p.y+4, 70) : '';
  $('#fx').innerHTML = hand;
  if (!G.unm) return;
  const st=G.pans[G.unm.i], L=panLayout(G.cake)[G.unm.i];
  st.lift = clamp(G.unm.y0-p.y, 0, 400);

}
function unmoldUp(){
  if (!G.unm) return;
  const st=G.pans[G.unm.i]; G.unm=null;
  if (!st.removed && !st.flying){ st.lift=0; toast('조금 더 높이 끌어올려요!'); viewBake(); }

function flyPan(st){
  st.flying = true; sfx.swoosh();

    if (!G || G.phase!=='unmold') return;
    st.lift += 22;
    if (st.lift > 420){ st.removed=true; st.flying=false; sfx.pop(); viewBake(); renderTray(); return; }
    viewBake(); requestAnimationFrame(f);

}

/* ================= 4. 크림 ================= */
function prepFrost(){
  const c=G.cake;
  if (use3D()){ if (!c.paint) C3D.resetPaint(c); return; }
  if (G.samples) return;
  const g=geom(c), b=g[0], top=g[g.length-1], pts=[];
  for (let x=b.cx-b.R*1.08; x<=b.cx+b.R*1.08; x+=9)
    for (let y=top.ty-top.R*K-4; y<=b.bottom+b.R*K+4; y+=9)
      if (inSilhouette(c,g,x,y)) pts.push([x,y]);
  G.samples = pts; G.covered = new Uint8Array(pts.length); G.nCovered = 0;
}
function paintAt(x,y){
  const c=G.cake, last=c.strokes[c.strokes.length-1];
  if (last && Math.hypot(last[0]-x,last[1]-y) < 7) return false;
  c.strokes.push([Math.round(x),Math.round(y)]);
  const r2=BRUSH*BRUSH, S=G.samples;
  for (let i=0;i<S.length;i++){ if (G.covered[i]) continue; const dx=S[i][0]-x, dy=S[i][1]-y; if (dx*dx+dy*dy<r2){ G.covered[i]=1; G.nCovered++; } }
  const was=c.cover;
  c.cover = S.length ? G.nCovered/S.length : 0;
  if (was<.93 && c.cover>=.93){ c.frostFull=true; c.cover=1; sfx.ok(); toast('크림을 매끈하게 발랐어요!'); }
  return true;
}
function viewFrost(){
  layer(use3D() ? '' : renderCake(G.cake));
  frostHUD();
}
function frostHUD(){
  const c=G.cake, turn = use3D() ? ' · 빈 곳을 끌면 케이크가 돌아가요' : '';
  if (G.tool==='bag'){
    setHint((c.dollops.length ? '누른 채 움직이면 테두리를 따라 크림이 줄줄이 짜져요' : '짤주머니를 꾹 누르고 있으면 크림이 나와요 (오래 누를수록 커져요)') + turn);
    setMeter(null); return;
  }
  setHint(!c.frost ? '아래에서 크림 색을 골라요' : !c.frostFull ? '스패출러를 대고 있으면 돌림판이 돌아서 뒤쪽까지 발라져요!' + turn : '크림 완성! 짤주머니로 테두리를 짜 보세요 ▶');
  setMeter(c.frost ? `${FROST[c.frost].n} 바르기` : null, c.cover);
}
/* ---------- 3D: 스패출러로 바르기 · 짤주머니로 짜기 ---------- */
function frostDown3(e){
  const c=G.cake;
  if (G.tool==='bag'){ pipeDown3(e); return; }
  const h = C3D.hit(e);
  if (!c.frost){ if (h){ toast('크림 색을 먼저 골라주세요!'); sfx.bad(); } return; }
  if (!h) return;
  G.spreading = true; G.lastE = {x:e.clientX, y:e.clientY}; $('#view').setPointerCapture(e.pointerId);
  C3D.paintHit(c, h); frostHUD();
  // 진짜 케이크 돌림판처럼: 스패출러를 대고 있으면 케이크가 천천히 돌아서 뒤쪽까지 크림이 발려요
  let last = performance.now();
  const spin = now => {
    if (!G || !G.spreading || G.step !== 3) return;
    const dt = Math.min(50, now - last); last = now;
    C3D.turn(dt*.0011);
    const hh = C3D.hit({clientX:G.lastE.x, clientY:G.lastE.y}); if (hh) C3D.paintHit(c, hh);
    if (Math.random() < .08) frostHUD();
    requestAnimationFrame(spin);
  };
  requestAnimationFrame(spin);
}
function frostMove3(e){
  const c=G.cake, p=svgPt(e);
  if (G.tool==='bag'){
    const q=G.squeeze;
    if (q && Math.hypot(p.x-q.last.x, p.y-q.last.y) >= (q.d.shell?13:26)*Math.max(.75,q.size)){
      const d = pipeNew3(e, Math.max(.6,q.size));
      if (d){ q.d = d; q.last = p; }
    }
    if (q) q.cur = p;
    $('#fx').innerHTML = (q || C3D.overCake(e)) ? bagSVG(p, FROST[G.bagCol].c, !!q) : '';
    return;
  }
  const col = c.frost ? FROST[c.frost].c : null;
  if (!G.spreading){ $('#fx').innerHTML = c.frost && C3D.hit(e) ? spatula(p,col) : ''; return; }
  const L=G.lastE, n=Math.max(1, Math.ceil(Math.hypot(e.clientX-L.x, e.clientY-L.y)/(8*Math.max(.6,SCALE))));
  for (let k=1;k<=n;k++){ const h = C3D.hit({clientX:lerp(L.x,e.clientX,k/n), clientY:lerp(L.y,e.clientY,k/n)}); if (h) C3D.paintHit(c, h); }
  G.lastE = {x:e.clientX, y:e.clientY};
  if (Math.random()<.06) beep(rnd(500,700),.04,'sine',.02);
  frostHUD(); $('#fx').innerHTML = spatula(p,col);
}
// 윗면이면 뾰족한 로제트, 각 단 아래 둘레 가까이면 조개 모양
function pipeNew3(e, size){
  const c=G.cake, b=C3D.baseHit(e,c), h=C3D.hit(e);
  let spot = null;
  if (h && h.part==='top' && !(b && b.d < .08)) spot = {tier:h.tier, u:h.u, v:h.v, base:false};
  else if (b) spot = b;
  if (!spot) return null;
  const d = Object.assign(spot, {col:G.bagCol, s:size, rot:rnd(-10,10)});
  c.dollops.push(d); beep(rnd(260,320),.06,'sine',.04);
  C3D.sync(c, ['dollops']);
  return d;
}
function pipeDown3(e){
  const p=svgPt(e), d=pipeNew3(e,.3);
  if (!d){ if (C3D.overCake(e)) toast('케이크 윗면이나 아래 테두리에 짜 주세요!'); return; }

function squeezeFrame3(now){
  if (!G || !G.squeeze) return;
  const q=G.squeeze, dt=Math.min(50,now-q.t); q.t=now;
  if (q.d.s < 1.35){ q.d.s = Math.min(1.35, q.d.s + dt/(q.d.base ? 600 : 1400)); q.size = q.d.s; C3D.sync(G.cake, ['dollops']); $('#fx').innerHTML = bagSVG(q.cur||q.last, FROST[G.bagCol].c, true); }

function spatula(p,col){ return `<g transform="translate(${p.x} ${p.y}) rotate(-35)"><rect x="-10" y="-6" width="20" height="64" rx="10" fill="#e9eef5" stroke="#9aa9bb" stroke-width="2"/>${col?`<rect x="-8" y="-4" width="16" height="22" rx="8" fill="${col}"/>`:''}<rect x="-6" y="56" width="12" height="44" rx="6" fill="#ff8fb1"/></g>`; }
// 짤주머니: 깍지 끝이 포인터 위치. 짤 때는 손으로 쥔 것처럼 살짝 찌그러져요.
function bagSVG(p,col,sq){

      <linearGradient id="pbBag" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".25" stop-color="#ffffff" stop-opacity=".15"/><stop offset=".7" stop-color="#ffffff" stop-opacity=".05"/><stop offset="1" stop-color="#dfe6ee" stop-opacity=".6"/></linearGradient>

    <path d="M-4 -.5 L4 -.5" stroke="#5d6672" stroke-width="1.4"/>

    <path d="M-8 -16 H8" stroke="#fff" stroke-width=".8" opacity=".7"/>
